openapi: 3.0.3
info:
  title: WAT Profile API
  description: |
    REST API สำหรับระบบเว็บไซต์วัดหลวงพ่อใส (Wat Loung Por Sai)

    ## Authentication
    ใช้ JWT Bearer Token สำหรับ endpoints ที่ต้องการ authentication

    ## Multi-Language Support
    ข้อมูลที่รองรับหลายภาษาจะอยู่ในรูปแบบ `MultiLangText` object:
    ```json
    { "th": "ข้อความ", "en": "Text", "de": "Text" }
    ```
  version: 1.0.0
  contact:
    name: Wat Loung Por Sai Team
    email: Watloungporsai@gmail.com

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Auth
    description: Authentication & User management
  - name: Events
    description: Events & Ceremonies (Public)
  - name: Monks
    description: Monk profiles (Public)
  - name: Gallery
    description: Photo gallery (Public)
  - name: Schedules
    description: Temple schedules (Public)
  - name: Donations
    description: Donation categories (Public)
  - name: Contact
    description: Contact form (Public)
  - name: Settings
    description: Site settings (Public)
  - name: Member
    description: Member profile & actions (Auth required)
  - name: Account
    description: >-
      Public account sign-in, sessions, profile & Google sign-in (feature-gated by
      PUBLIC_ACCOUNT_AUTH_ENABLED). Security-relevant account operations (registration,
      verification, login success/failure, refresh reuse, recovery, Google link, session
      revoke, closure) are recorded as allow-listed security events with a coarse IP
      prefix and trace ID; event persistence never fails the user operation.
  - name: Community
    description: Community Q&A reads, member contributions, reports, and admin moderation
  - name: Admin - Users
    description: Users management (Admin only)
  - name: Admin - Account Operations
    description: Public-account safety operations (Admin only)
  - name: Admin - Roles
    description: Roles & permissions management (Admin only)
  - name: Admin - Audit Logs
    description: Audit trail logs (Admin only)
  - name: Admin - Events
    description: Events management (Admin only)
  - name: Admin - Monks
    description: Monks management (Admin only)
  - name: Admin - Gallery
    description: Gallery management (Admin only)
  - name: Admin - Media
    description: Media library management (Admin only)
  - name: Admin - Schedules
    description: Schedules management (Admin only)
  - name: Admin - Website
    description: Website CMS pages management (Admin only)
  - name: Admin - Donations
    description: Donations management (Admin only)
  - name: Admin - Members
    description: Members management (Admin only)
  - name: Admin - Registrations
    description: Event registrations management (Admin only)
  - name: Admin - Contacts
    description: Contact inquiries management (Admin only)
  - name: Admin - Settings
    description: Settings management (Admin only)

paths:
  # ==================== PUBLIC ====================
  /accounts/community/questions:
    post:
      tags: [Community]
      summary: Create a verified-member Community question
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityCreateQuestionRequest'
      responses:
        '201':
          description: Question published immediately for a trusted account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityQuestionMutationResponse' }
        '202':
          description: First contribution is pending moderation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityQuestionMutationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /accounts/community/questions/{id}:
    get:
      tags: [Community]
      summary: Read one owned Community question for editing
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Owned question detail, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityQuestionMutationResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Community]
      summary: Edit an owned Community question
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityUpdateQuestionRequest' }
      responses:
        '200': { description: Question updated immediately, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityQuestionMutationResponse' } } } }
        '202': { description: Significant edit is pending moderation, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityQuestionMutationResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Community]
      summary: Soft-delete an owned unanswered question
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Question deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /accounts/community/activity:
    get:
      tags: [Community]
      summary: List the authenticated member's Community questions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Member-only activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityMemberActivityResponse' }

  /accounts/community/questions/{id}/viewer:
    get:
      tags: [Community]
      summary: Read viewer actions for a Community question
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Viewer-specific state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityViewerStateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/community/questions/{id}/answers:
    post:
      tags: [Community]
      summary: Add a verified-member answer
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityCreateAnswerRequest' }
      responses:
        '201': { description: Published answer, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAnswerMutationResponse' } } } }
        '202': { description: Answer pending moderation, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAnswerMutationResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Question is not accepting contributions, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /accounts/community/questions/{id}/comments:
    post:
      tags: [Community]
      summary: Add a one-level clarification comment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityCreateCommentRequest' }
      responses:
        '201': { description: Published comment, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityCommentMutationResponse' } } } }
        '202': { description: Comment pending moderation, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityCommentMutationResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Question is not accepting contributions, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /accounts/community/answers/{id}:
    patch:
      tags: [Community]
      summary: Edit an owned answer
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityUpdateAnswerRequest' }
      responses:
        '200': { description: Answer updated, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAnswerMutationResponse' } } } }
        '202': { description: Answer edit pending moderation, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAnswerMutationResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /accounts/community/comments/{id}:
    patch:
      tags: [Community]
      summary: Edit an owned comment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityUpdateCommentRequest' }
      responses:
        '200': { description: Comment updated, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityCommentMutationResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /accounts/community/answers/{id}/accept:
    post:
      tags: [Community]
      summary: Accept an answer to an owned question
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Accepted answer, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAcceptanceResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /accounts/community/answers/{id}/helpful:
    put:
      tags: [Community]
      summary: Mark a published answer as helpful
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Helpful vote state, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityHelpfulResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Question is locked or answer is not published, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Community]
      summary: Remove the current member's helpful vote
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Helpful vote state, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityHelpfulResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Question is locked or answer is not published, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      deprecated: true
      tags: [Community]
      summary: Toggle helpful vote on a published answer
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Helpful vote state, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityHelpfulResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /accounts/community/reports:
    post:
      tags: [Community]
      summary: Report published Community content
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityCreateReportRequest' }
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityReportResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /accounts/community/notifications:
    get:
      tags: [Community]
      summary: List the authenticated member's Community notifications
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: unread_only, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Notification page, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityNotificationPageResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }

  /accounts/community/notifications/{id}/read:
    post:
      tags: [Community]
      summary: Mark one Community notification as read
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Notification marked read, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/community/notifications/read-all:
    post:
      tags: [Community]
      summary: Mark all Community notifications as read
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Notifications marked read, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }

  /accounts/community/notifications/preferences:
    get:
      tags: [Community]
      summary: Get Community email notification preferences
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Preferences, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityNotificationPreferencesResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Community]
      summary: Update Community email notification preferences
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_preferences]
              properties:
                email_preferences:
                  type: object
                  additionalProperties: { type: boolean }
      responses:
        '200': { description: Preferences updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }

  /admin/community/queue:
    get:
      tags: [Community]
      summary: List pending Community moderation items and open reports
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Moderation queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityModerationQueueResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/community/categories:
    get:
      tags: [Community]
      summary: List all Community categories for Admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Categories, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAdminCategoryListResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Community]
      summary: Create a Community category
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityCategoryInput' }
      responses:
        '201': { description: Category created, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAdminCategoryResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/community/categories/reorder:
    put:
      tags: [Community]
      summary: Reorder Community categories
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200': { description: Category order updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }

  /admin/community/categories/{id}:
    put:
      tags: [Community]
      summary: Update a Community category
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityCategoryInput' }
      responses:
        '200': { description: Category updated, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityAdminCategoryResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Community]
      summary: Delete an unused Community category
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityReportDecisionRequest' }
      responses:
        '204': { description: Category deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/community/revisions/{id}/decision:
    post:
      tags: [Community]
      summary: Approve or reject a pending Community revision
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityRevisionDecisionRequest' }
      responses:
        '200': { description: Revision decision saved, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/community/answers/{id}/official:
    post:
      tags: [Community]
      summary: Mark a published answer as official
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityModerationRequest' }
      responses:
        '200': { description: Official state updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/community/members/{id}/restriction:
    post:
      tags: [Community]
      summary: Restrict, unrestrict, or ban a Community member
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityModerationRequest' }
      responses:
        '200': { description: Member restriction updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/community/moderate/{target}/{id}:
    post:
      tags: [Community]
      summary: Apply a moderation action
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: target, in: path, required: true, schema: { type: string, enum: [question, answer, comment, member] } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityModerationRequest' }
      responses:
        '200': { description: Moderation action applied, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/community/reports/{id}/resolve:
    post:
      tags: [Community]
      summary: Resolve a Community report
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityReportDecisionRequest' }
      responses:
        '200': { description: Report resolved, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/community/reports/{id}/dismiss:
    post:
      tags: [Community]
      summary: Dismiss a Community report
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityReportDecisionRequest' }
      responses:
        '200': { description: Report dismissed, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /public/community/categories:
    get:
      tags: [Community]
      summary: List active Community categories
      responses:
        '200':
          description: Active localized categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityCategoryListResponse'
        '404':
          description: Community reads are disabled

  /public/community/questions:
    get:
      tags: [Community]
      summary: List published Community questions
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: locale
          in: query
          schema: { type: string, enum: [th, en, de, all] }
        - name: lifecycle
          in: query
          schema: { type: string, enum: [open, answered, resolved, locked, archived] }
      responses:
        '200':
          description: Cursor-paginated published questions
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityQuestionListResponse'
        '304':
          description: Response has not changed
        '400':
          description: Invalid filter or cursor

