      tags: [Admin - Dashboard]
      summary: Get admin dashboard statistics
      description: Requires the `dashboard:read` permission.
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/dashboard/overview:
    get:
      tags: [Admin - Dashboard]
      summary: Get complete actionable dashboard overview (stats, pending tasks, upcoming events)
      description: Requires the `dashboard:read` permission.
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Dashboard overview payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/notifications:
    get:
      tags: [Admin - Dashboard]
      summary: Get admin notification summary and recent pending items
      description: Requires the `dashboard:read` permission.
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Admin notification center summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          total_unread:
                            type: integer
                          pending_contacts:
                            type: integer
                          pending_registrations:
                            type: integer
                          pending_donations:
                            type: integer
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                type:
                                  type: string
                                title:
                                  type: string
                                message:
                                  type: string
                                link:
                                  type: string
                                created_at:
                                  type: string
                                  format: date-time
                                is_new:
                                  type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/me:
    put:
      tags: [Admin - Self Service]
      summary: Update the authenticated admin's own profile
      description: >-
        Updates the signed-in admin's own name, email, avatar, or password.
        Requires the `profile:update` permission. When a new password is
        supplied the current password must match and every existing admin
        session for the user is revoked.
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProfileUpdateInput'
      responses:
        '200':
          description: Updated admin profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
