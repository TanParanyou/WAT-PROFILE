            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Member'
    put:
      tags: [Member]
      summary: Update my member profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: Profile updated

  /member/donations:
    get:
      tags: [Member]
      summary: Get my donation history
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Member donation history (paginated)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MemberDonation'

  /member/registrations:
    get:
      tags: [Member]
      summary: Get my event registrations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Registrations list

  /account/registrations:
    get:
      tags: [Account]
      summary: List registrations owned by the signed-in Public Account
      security:
        - PublicAccountBearerAuth: []
      responses:
        '200':
          description: Registration list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventRegistrationListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /account/registrations/{id}:
    patch:
      tags: [Account]
      summary: Update a Public Account-owned registration
      security:
        - PublicAccountBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRegistrationUpdateInput'
      responses:
        '200':
          description: Updated registration
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /account/registrations/{id}/cancel:
    post:
      tags: [Account]
      summary: Cancel a Public Account-owned registration
      security:
        - PublicAccountBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRegistrationCancelReasonInput'
      responses:
        '200':
          description: Registration cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ==================== ADMIN - Users & Roles ====================
  /admin/dashboard/stats:
