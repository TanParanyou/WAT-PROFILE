        '200':
          description: Donation categories

  /public/donations:
    post:
      tags: [Donations]
      summary: Submit a proof-backed donation report
      description: Bank transfer and PayPal reports require a private proof file. Rate limited separately from account auth.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [amount, currency, donation_date, donation_time, donation_method, donor_name, donor_email, locale, proof, privacy_acknowledged]
              properties:
                amount: {type: number, minimum: 0.01}
                currency: {type: string, enum: [EUR]}
                donation_date: {type: string, format: date}
                donation_time: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
                donation_method: {type: string, enum: [bank_transfer, paypal]}
                donor_name: {type: string}
                donor_email: {type: string, format: email}
                donor_phone: {type: string}
                category_id: {type: integer, minimum: 1, nullable: true}
                locale: {type: string, enum: [th, en, de]}
                receipt_requested: {type: boolean}
                privacy_acknowledged: {type: boolean}
                proof: {type: string, format: binary}
      responses:
        '201': {description: Donation report accepted}
        '400':
          description: Invalid donation fields; the optional `fields` object maps request field names to messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /public/privacy-requests:
    post:
      tags: [Privacy]
      summary: Submit public data subject privacy request (PDPA/GDPR)
      description: >-
        Submits a data subject access or erasure request from the public website.
        Requests with a non-empty `website` honeypot return the same success response
        without persistence. Request bodies are capped at 32 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_type]
              properties:
                subject_email:
                  type: string
                  format: email
                  example: user@example.com
                subject_member_code:
                  type: string
                  example: M-10023
                request_type:
                  type: string
                  enum: [access, erasure]
                  example: access
                notes:
                  type: string
                  example: ขอรับสำเนาข้อมูลส่วนบุคคลทั้งหมด
                website:
                  type: string
                  description: Honeypot field; must be empty
      responses:
        '201':
          description: Privacy request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      request_type:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      message:
                        type: string
        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/contact:
    post:
      tags: [Contact]
      summary: Submit contact form
      description: >-
        Persists a contact inquiry and queues an operator notification in one
        transaction. Requests with a non-empty `website` honeypot return the
        same success response without persistence. Rate limited to 5 requests
        per minute; request bodies are capped at 32 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Contact accepted; the response never includes visitor data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - type: object
                    example:
                      success: true
                      message: Message received.
        '400':
          description: Invalid contact fields or oversized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactValidationError'
        '429':
          description: Contact rate limit reached
          headers:
            Retry-After:
              description: Integer seconds until another request may be attempted
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactRateLimitError'
        '500':
          description: Contact could not be durably accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/settings:
    get:
      tags: [Settings]
      summary: Get public settings
      responses:
        '200':
          description: Public settings as key-value map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  # ==================== AUTH ====================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Rate limited to 5 requests per minute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Rate limited to 10 requests per minute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Auth]
      summary: Update current user profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                avatar_url:
                  type: string
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'


  # ==================== ADMIN AUTH ====================
  /auth/admin/login:
    post:
      tags: [Admin Auth]
      summary: Admin login
      description: >-
        Rate limited to 5 requests per minute per IP. On success sets the
        `wat_admin_refresh` HttpOnly cookie (path `/api/v1/auth/admin`,
        SameSite=Strict, Secure outside local development) carrying the rotating
        refresh credential. The refresh credential is never returned in JSON;
        only the short-lived Admin access token and user are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginInput'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly `wat_admin_refresh` session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AdminAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid admin credentials
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      code:
                        type: string
                        example: ADMIN_INVALID_CREDENTIALS
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/admin/refresh:
    post:
      tags: [Admin Auth]
      summary: Rotate the Admin session
      description: >-
        Reads the `wat_admin_refresh` cookie and rotates the session credential,
        returning a fresh Admin access token. Multiple concurrent refreshes
        within the grace window are supported. Reuse of an already-rotated
        credential outside the grace window revokes the session.
      responses:
        '200':
          description: Session rotated
          headers:
            Set-Cookie:
              description: Rotated `wat_admin_refresh` session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AdminAuthResponse'
        '401':
          description: Invalid, expired, or revoked Admin session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      code:
                        type: string
                        example: ADMIN_SESSION_INVALID

  /auth/admin/mfa-verify:
    post:
      tags: [Admin Auth]
      summary: Verify Admin 2FA challenge code
      description: >-
        Validates a 6-digit TOTP code or an unused 8-character backup recovery
        code using the temporary `mfa_token` issued from `/auth/admin/login`.
        On success sets the `wat_admin_refresh` HttpOnly cookie and returns an
        Admin access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: MFA verification successful
          headers:
            Set-Cookie:
              description: HttpOnly `wat_admin_refresh` session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AdminAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid MFA code or expired session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      code:
                        type: string
                        example: ADMIN_MFA_INVALID_CODE

  /auth/admin/logout:
    post:
      tags: [Admin Auth]
      summary: Revoke the Admin session and clear the cookie
      description: >-
        Revokes the session server-side (idempotent) and always clears the
        `wat_admin_refresh` cookie, even when the credential is invalid or
        expired.
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              description: Cleared `wat_admin_refresh` session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'


  # ==================== PUBLIC ACCOUNTS ====================
  # The public account API is only mounted when PUBLIC_ACCOUNT_AUTH_ENABLED=true.
  # These routes never create or mutate Member records: accounts are role-less.
  # Public access tokens carry audience `public-account` and are rejected by the
  # Admin API (see AdminBearerAuth).
  /accounts/register:
    post:
      tags: [Account]
      summary: Register a public account with email verification
      description: >-
        Creates a pending-verification account. A single-use verification email
        is sent to the address; the account cannot sign in until verified.
        Rate limit: 5 per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRegisterInput'
      responses:
        '200':
          description: Registration accepted; verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/verify-email:
    post:
      tags: [Account]
      summary: Verify an email address with a single-use token
      description: 'Single-use verification endpoint. Rate limit: 10 per 15 minutes.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTokenInput'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/resend-verification:
    post:
      tags: [Account]
      summary: Resend the verification email
      description: 'Rate limit: 3 per 1 hour. Responds generically to avoid leaking account existence.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmailInput'
      responses:
        '200':
          description: Accepted; email sent if the address exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/login:
    post:
      tags: [Account]
      summary: Sign in with email and password
      description: >-
        Returns the short-lived access token (audience `public-account`) in the
        body and sets the rotating refresh token in the HttpOnly `wat_public_refresh`
        cookie (Path /api/v1/accounts). The refresh token is never returned in
        the body. Rate limit: 10 per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLoginInput'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: HttpOnly `wat_public_refresh` refresh cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSessionResponse'
        '401':
          description: Invalid credentials or unverified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/refresh:
    post:
      tags: [Account]
      summary: Rotate the session using the refresh cookie
      description: >-
        Requires the `wat_public_refresh` HttpOnly cookie and an allowed Origin.
        Returns a new access token and rotates the refresh token. Reuse of an
        already-rotated token revokes the whole session family.
      responses:
        '200':
          description: Session rotated
          headers:
            Set-Cookie:
              description: Rotated `wat_public_refresh` cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSessionResponse'
        '401':
          description: Session invalid, expired, or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/reauthenticate:
    post:
      tags: [Account]
      summary: Reauthenticate the current password session
      description: >-
        Requires the current public-account access token and password. Returns
        a fresh access token with a new auth_time for sensitive actions without
        creating or rotating a refresh session. Rate limit: 5 per 15 minutes.
      security:
        - PublicAccountBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountReauthenticateInput'
      responses:
        '200':
          description: Reauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/forgot-password:
    post:
      tags: [Account]
      summary: Request a password reset link
      description: >-
        Always responds generically to avoid leaking account existence. Rate
        limit: 5 per 1 hour. Google-only accounts receive a sign-in explanation
        with a link to continue with Google.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmailInput'
      responses:
        '200':
          description: Accepted; reset link sent if the address exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/reset-password:
    post:
      tags: [Account]
      summary: Reset the password with a single-use token
      description: 'Consumes the token, replaces the password hash, and revokes all sessions. Rate limit: 5 per 1 hour.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountResetPasswordInput'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/confirm-email-change:
    post:
      tags: [Account]
      summary: Confirm a pending email change
      description: 'Single-use confirmation endpoint. Rate limit: 5 per 1 hour.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTokenInput'
      responses:
        '200': { description: Email changed, content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /accounts/reopen-request:
    post:
      tags: [Account]
      summary: Request an account recovery link
      description: 'Generic response to avoid account enumeration. Rate limit: 5 per 1 hour.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmailInput'
      responses:
        '200': { description: Generic response, content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /accounts/reopen-confirm:
    post:
      tags: [Account]
      summary: Restore a closed account
      description: 'Consumes a single-use recovery token. Rate limit: 5 per 1 hour.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTokenInput'
      responses:
        '200': { description: Account restored, content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /account/password:
    post:
      tags: [Account]
      summary: Add or change the account password
      description: 'Requires recent authentication (auth_time within 10 minutes). Submit credentials to the shared re-authentication endpoint first; this mutation accepts only the new password. Rate limit: 5 per 1 hour.'
      security:
        - PublicAccountBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPasswordChangeInput'
      responses:
        '200':
          description: Password changed and current access token renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSessionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /account/email-change:
    post:
      tags: [Account]
      summary: Request an email change confirmation
      description: 'Sends a single-use confirmation to the new address. Rate limit: 5 per 1 hour.'
      security:
        - PublicAccountBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmailChangeInput'
      responses:
        '200': { description: Confirmation sent, content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /accounts/google/start:
    get:
      tags: [Account]
      summary: Begin Google sign-in
      description: >-
        Creates a short-lived signed flow state (PKCE + nonce) and returns the
        Google authorization URL. Sets the HttpOnly `wat_google_flow` cookie
        (Path /api/v1/accounts/google, 10 minute TTL). Rate limit: 20 per 15 minutes.
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
            example: en
        - name: return_to
          in: query
          required: false
          schema:
            type: string
            example: /account
      responses:
        '200':
          description: Google authorization URL issued
          headers:
            Set-Cookie:
              description: HttpOnly `wat_google_flow` flow cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGoogleStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/google/callback:
    get:
      tags: [Account]
      summary: Complete Google sign-in
      description: >-
        Verifies state, PKCE, nonce, and the Google identity, then redirects the
        browser to the frontend. Never includes tokens in the redirect URL.
        Outcomes: 302 to `{frontend}/{locale}{return_to}` on sign-in (sets the
        refresh cookie), 302 to `{frontend}/{locale}/account/link?status=approval_sent`
        when an existing email needs approval, or 302 to
        `{frontend}/{flow-locale}/account/login?error={code}` on failure. The
        callback preserves the locale recorded when the OAuth flow started.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the frontend (never contains tokens)
          headers:
            Location:
              description: Frontend redirect target
              schema:
                type: string
            Set-Cookie:
              description: Refresh cookie on success, cleared flow cookie otherwise
              schema:
                type: string

  /accounts/google/link/confirm:
    post:
      tags: [Account]
      summary: Confirm linking a Google identity to an existing email
      description: >-
        Consumes the single-use link-approval token emailed to the existing
        account and returns a new session. Never links silently. Rate limit: 20
        per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTokenInput'
      responses:
        '200':
          description: Google identity linked; session started
          headers:
            Set-Cookie:
              description: HttpOnly `wat_public_refresh` refresh cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSessionResponse'
        '401':
          description: Token invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/google/link/start:
    get:
      tags: [Account]
      summary: Begin linking the current Google identity to this account
      description: >-
        Requires a signed-in public account and an allowed Origin. Creates a
        short-lived signed flow state (PKCE + nonce) bound to the current
        account and returns the Google authorization URL. Sets the HttpOnly
        `wat_google_flow` cookie (Path /api/v1/accounts/google, 10 minute TTL).
        Never links silently: the same verified Google email must approve the
        link through the single-use email token. Anonymous login/register
        behavior of `/accounts/google/start` is unchanged. Rate limit: 20 per
        15 minutes.
      security:
        - PublicAccountBearerAuth: []
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
            example: en
        - name: return_to
          in: query
          required: false
          schema:
            type: string
            example: /account
      responses:
        '200':
          description: Google authorization URL issued for linking
          headers:
            Set-Cookie:
              description: HttpOnly `wat_google_flow` flow cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGoogleStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Re-authentication required or account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Google identity already linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Approval request pending (cooldown) or rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/google/reauth/start:
    get:
      tags: [Account]
      summary: Begin Google re-authentication for the current account
      description: >-
        Requires a signed-in public account and an allowed Origin. Creates a
        short-lived PKCE flow bound to the current account. The callback only
        succeeds when the verified Google subject matches the identity already
        connected to that account. Rate limit: 20 per 15 minutes.
      security:
        - PublicAccountBearerAuth: []
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
            example: en
        - name: return_to
          in: query
          required: false
          schema:
            type: string
            example: /account?tab=security&close=confirm
      responses:
        '200':
          description: Google authorization URL issued for re-authentication
          headers:
            Set-Cookie:
              description: HttpOnly `wat_google_flow` flow cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGoogleStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/google/link/status:
    get:
      tags: [Account]
      summary: Get Google link status for the current account
      description: >-
        Requires a signed-in public account. Reports whether a Google identity
        is connected and whether a link approval email is pending, including
        the remaining cooldown before another approval email may be requested.
        Token payloads and timestamps are never exposed.
      security:
        - PublicAccountBearerAuth: []
      responses:
        '200':
          description: Google link status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLinkStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account disabled or closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /account/providers/google:
    delete:
      tags: [Account]
      summary: Disconnect the Google identity from this account
      description: >-
        Requires a signed-in public account, recent authentication (auth_time
        within 10 minutes). The re-authentication credential is submitted to
        the shared re-authentication endpoint before this request.
        Removes only the Google identity; the password identity and all
        sessions are untouched. Idempotent when no Google identity is present.
        Rate limit: 5 per 1 hour.
      security:
        - PublicAccountBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmptyInput'
      responses:
        '200':
          description: Google identity disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Re-authentication required or account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /accounts/logout:
    post:
      tags: [Account]
      summary: Sign out and revoke the current session
      description: >-
        Requires a public-account access token and an allowed Origin. Revokes the
        session family and clears the `wat_public_refresh` cookie.
      security:
        - PublicAccountBearerAuth: []
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              description: Cleared `wat_public_refresh` cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /accounts/logout-all:
    post:
      tags: [Account]
      summary: Sign out of every session
      description: Revokes all sessions for the account and clears the refresh cookie.
      security:
        - PublicAccountBearerAuth: []
      responses:
        '200':
          description: Logged out everywhere
          headers:
            Set-Cookie:
              description: Cleared `wat_public_refresh` cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /account:
    get:
      tags: [Account]
      summary: Get the signed-in account profile
      security:
        - PublicAccountBearerAuth: []
      responses:
        '200':
          description: Account profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account disabled or closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /account/profile:
    patch:
      tags: [Account]
      summary: Update the account profile
      security:
        - PublicAccountBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfileUpdateInput'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /account/avatar:
    post:
      tags: [Account]
      summary: Upload a profile avatar
      description: >-
        Validates and stores a JPEG or PNG avatar for the signed-in account.
        The client prepares the crop, while the server verifies the image bytes,
        dimensions, and size before storing it. Rate limit: 12 per 1 hour;
        failed old-object deletion is queued for retry.
      security:
        - PublicAccountBearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG or PNG image, maximum 5 MiB and 4096×4096 pixels
      responses:
        '200':
          description: Updated account profile with the stored avatar URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Avatar exceeds the size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /account/sessions:
    get:
      tags: [Account]
      summary: List active sessions
      security:
        - PublicAccountBearerAuth: []
      responses:
        '200':
          description: Session list (hashes never serialized)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /account/sessions/{id}:
    delete:
      tags: [Account]
      summary: Revoke one session
      security:
        - PublicAccountBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /account/close:
    post:
      tags: [Account]
      summary: Close the account
      description: >-
        Requires recent authentication (auth_time within 10 minutes) and the
        shared re-authentication flow for password or Google accounts. Revokes
        all sessions, marks the account
        closed, blanks the avatar, and schedules permanent deletion after 30
        days. The account can be restored by a single-use email link before the
        deadline. Rate limit: 3 per 1 hour.
      security:
        - PublicAccountBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmptyInput'
      responses:
        '200':
          description: Account closed
          headers:
            Set-Cookie:
              description: Cleared `wat_public_refresh` cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountClosureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Re-authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'


  # ==================== MEMBER ====================
  /member/register:
    post:
      tags: [Member]
      summary: Register as temple member
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Member registered
        '401':
          $ref: '#/components/responses/Unauthorized'

  /member/profile:
    get:
      tags: [Member]
      summary: Get my member profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Member profile
