openapi: 3.0.3
info:
  title: WAT Profile API
  description: |
    REST API สำหรับระบบเว็บไซต์วัดหลวงพ่อใส (Wat Loung Por Sai)

    ## Authentication
    ใช้ JWT Bearer Token สำหรับ endpoints ที่ต้องการ authentication

    ## Multi-Language Support
    ข้อมูลที่รองรับหลายภาษาจะอยู่ในรูปแบบ `MultiLangText` object:
    ```json
    { "th": "ข้อความ", "en": "Text", "de": "Text" }
    ```
  version: 1.0.0
  contact:
    name: Wat Loung Por Sai Team
    email: Watloungporsai@gmail.com

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Auth
    description: Authentication & User management
  - name: Events
    description: Events & Ceremonies (Public)
  - name: Monks
    description: Monk profiles (Public)
  - name: Gallery
    description: Photo gallery (Public)
  - name: Schedules
    description: Temple schedules (Public)
  - name: Donations
    description: Donation categories (Public)
  - name: Contact
    description: Contact form (Public)
  - name: Settings
    description: Site settings (Public)
  - name: Member
    description: Member profile & actions (Auth required)
  - name: Admin - Users
    description: Users management (Admin only)
  - name: Admin - Roles
    description: Roles & permissions management (Admin only)
  - name: Admin - Audit Logs
    description: Audit trail logs (Admin only)
  - name: Admin - Events
    description: Events management (Admin only)
  - name: Admin - Monks
    description: Monks management (Admin only)
  - name: Admin - Gallery
    description: Gallery management (Admin only)
  - name: Admin - Media
    description: Media library management (Admin only)
  - name: Admin - Schedules
    description: Schedules management (Admin only)
  - name: Admin - Website
    description: Website CMS pages management (Admin only)
  - name: Admin - Donations
    description: Donations management (Admin only)
  - name: Admin - Members
    description: Members management (Admin only)
  - name: Admin - Registrations
    description: Event registrations management (Admin only)
  - name: Admin - Contacts
    description: Contact inquiries management (Admin only)
  - name: Admin - Settings
    description: Settings management (Admin only)

paths:
  # ==================== PUBLIC ====================
  /public/events:
    get:
      tags: [Events]
      summary: List all active events
      responses:
        '200':
          description: Events list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /public/events/{slug}:
    get:
      tags: [Events]
      summary: Get event by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/events/{id}/register:
    post:
      tags: [Events]
      summary: Register for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRegistrationInput'
      responses:
        '201':
          description: Registration created
        '400':
          $ref: '#/components/responses/BadRequest'

  /public/monks:
    get:
      tags: [Monks]
      summary: List all monks
      responses:
        '200':
          description: Monks list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /public/monks/{slug}:
    get:
      tags: [Monks]
      summary: Get monk by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Monk detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Monk'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/gallery:
    get:
      tags: [Gallery]
      summary: List gallery images
      responses:
        '200':
          description: Gallery list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /public/gallery/categories:
    get:
      tags: [Gallery]
      summary: List gallery categories
      responses:
        '200':
          description: Categories list

  /public/schedules:
    get:
      tags: [Schedules]
      summary: Get temple schedules
      responses:
        '200':
          description: Schedules list

  /public/donation-categories:
    get:
      tags: [Donations]
      summary: List donation categories
      responses:
        '200':
          description: Donation categories

  /public/contact:
    post:
      tags: [Contact]
      summary: Submit contact form
      description: Rate limited to 5 requests per minute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Contact submitted
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /public/settings:
    get:
      tags: [Settings]
      summary: Get public settings
      responses:
        '200':
          description: Public settings as key-value map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  # ==================== AUTH ====================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Rate limited to 5 requests per minute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Rate limited to 10 requests per minute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Auth]
      summary: Update current user profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                avatar_url:
                  type: string
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'


  # ==================== ADMIN AUTH ====================
  /auth/admin/login:
    post:
      tags: [Admin Auth]
      summary: Admin login
      description: >-
        Rate limited to 5 requests per minute per IP. On success sets the
        `wat_admin_refresh` HttpOnly cookie (path `/api/v1/auth/admin`,
        SameSite=Strict, Secure outside local development) carrying the rotating
        refresh credential. The refresh credential is never returned in JSON;
        only the short-lived Admin access token and user are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginInput'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly `wat_admin_refresh` session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AdminAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid admin credentials
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      code:
                        type: string
                        example: ADMIN_INVALID_CREDENTIALS
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/admin/refresh:
    post:
      tags: [Admin Auth]
      summary: Rotate the Admin session
      description: >-
        Reads the `wat_admin_refresh` cookie and rotates the session credential,
        returning a fresh Admin access token. Multiple concurrent refreshes
        within the grace window are supported. Reuse of an already-rotated
        credential outside the grace window revokes the session.
      responses:
        '200':
          description: Session rotated
          headers:
            Set-Cookie:
              description: Rotated `wat_admin_refresh` session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AdminAuthResponse'
        '401':
          description: Invalid, expired, or revoked Admin session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      code:
                        type: string
                        example: ADMIN_SESSION_INVALID

  /auth/admin/logout:
    post:
      tags: [Admin Auth]
      summary: Revoke the Admin session and clear the cookie
      description: >-
        Revokes the session server-side (idempotent) and always clears the
        `wat_admin_refresh` cookie, even when the credential is invalid or
        expired.
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              description: Cleared `wat_admin_refresh` session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'


  # ==================== MEMBER ====================
  /member/register:
    post:
      tags: [Member]
      summary: Register as temple member
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Member registered
        '401':
          $ref: '#/components/responses/Unauthorized'

  /member/profile:
    get:
      tags: [Member]
      summary: Get my member profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Member profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Member'
    put:
      tags: [Member]
      summary: Update my member profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: Profile updated

  /member/donations:
    post:
      tags: [Member]
      summary: Create a donation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationInput'
      responses:
        '201':
          description: Donation created

  /member/registrations:
    get:
      tags: [Member]
      summary: Get my event registrations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Registrations list

  # ==================== ADMIN - Users & Roles ====================
  /admin/dashboard/stats:
    get:
      tags: [Admin - Dashboard]
      summary: Get admin dashboard statistics
      description: Requires the `dashboard:read` permission.
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users:
    get:
      tags: [Admin - Users]
      summary: List users (admin)
      description: Query parameters support repeated values for multi-select (OR within filter, AND across filters), e.g. `?status=active&status=inactive`.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: status
          in: query
          description: Status filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: role
          in: query
          description: Role ID filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated users list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'

  /admin/roles:
    get:
      tags: [Admin - Roles]
      summary: List roles (admin)
      description: Query parameters support repeated values for multi-select.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: status
          in: query
          description: Status filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated roles list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'

  # ==================== ADMIN - Audit Logs ====================
  /admin/audit-logs/filter-options:
    get:
      tags: [Admin - Audit Logs]
      summary: Get distinct audit log actions and entity types
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Distinct filter options for audit logs

  /admin/audit-logs:
    get:
      tags: [Admin - Audit Logs]
      summary: List audit logs (admin)
      description: Query parameters support repeated values for multi-select.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: action
          in: query
          description: Action filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: entity_type
          in: query
          description: Entity type filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: user
          in: query
          description: User ID filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated audit logs list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'

  # ==================== ADMIN - Events ====================
  /admin/events:
    get:
      tags: [Admin - Events]
      summary: List all events (admin)
      description: Query parameters support repeated values for multi-select, e.g. `?status=active&status=inactive`.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: status
          in: query
          description: Status filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: type
          in: query
          description: Event type filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated events list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Event'
    post:
      tags: [Admin - Events]
      summary: Create event
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '201':
          description: Event created

  /admin/events/{id}:
    put:
      tags: [Admin - Events]
      summary: Update event
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Event updated
    delete:
      tags: [Admin - Events]
      summary: Delete event
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Event deleted

  # ==================== ADMIN - Monks ====================
  /admin/monks:
    get:
      tags: [Admin - Monks]
      summary: List all monks (admin)
      description: Query parameters support repeated values for multi-select.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: status
          in: query
          description: Status filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated monks list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Monk'
    post:
      tags: [Admin - Monks]
      summary: Create monk
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Monk'
      responses:
        '201':
          description: Monk created

  /admin/monks/{id}:
    put:
      tags: [Admin - Monks]
      summary: Update monk
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Monk'
      responses:
        '200':
          description: Monk updated
    delete:
      tags: [Admin - Monks]
      summary: Delete monk
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Monk deleted

  # ==================== ADMIN - Gallery ====================
  /admin/gallery:
    get:
      tags: [Admin - Gallery]
      summary: List gallery (admin)
      description: Query parameters support repeated values for multi-select.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: status
          in: query
          description: Status filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: category
          in: query
          description: Category ID filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: event
          in: query
          description: Event ID filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated gallery list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Gallery'
    post:
      tags: [Admin - Gallery]
      summary: Create gallery item
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Gallery'
      responses:
        '201':
          description: Gallery item created

  /admin/gallery/{id}:
    put:
      tags: [Admin - Gallery]
      summary: Update gallery item
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Gallery'
      responses:
        '200':
          description: Gallery item updated
    delete:
      tags: [Admin - Gallery]
      summary: Delete gallery item
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Gallery item deleted

  /admin/gallery/categories:
    get:
      tags: [Admin - Gallery]
      summary: List gallery categories (admin)
      description: Query parameters support repeated values for multi-select.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: status
          in: query
          description: Status filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated categories list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
