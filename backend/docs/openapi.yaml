                      data:
                        type: object
                        properties:
                          secret:
                            type: string
                          otpauth_uri:
                            type: string

  /admin/2fa/verify-setup:
    post:
      tags: [Admin - Self Service]
      summary: Verify and enable 2FA
      description: Validates the first OTP and returns backup recovery codes.
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
