components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived Admin access token with audience `admin`. Issued only by
        `/auth/admin/login` and `/auth/admin/refresh`. Held only in memory by
        the client; never stored in browser storage.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    MediaIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      description: Page number (1-based)
      required: false
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Number of items per page (10, 25, 50, 100)
      required: false
      schema:
        type: integer
        default: 25
        enum: [10, 25, 50, 100]
    SearchParam:
      name: search
      in: query
      description: Search string matched against text/JSONB fields
      required: false
      schema:
        type: string
    SortParam:
      name: sort
      in: query
      description: Field name to sort by
      required: false
      schema:
        type: string
    OrderParam:
      name: order
      in: query
      description: Sort direction (asc or desc)
      required: false
      schema:
        type: string
        enum: [asc, desc]
    FromParam:
      name: from
      in: query
      description: Start date filter (RFC3339 or YYYY-MM-DD)
      required: false
      schema:
        type: string
    ToParam:
      name: to
      in: query
      description: End date filter (RFC3339 or YYYY-MM-DD)
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ===== Common =====
    MultiLangText:
      type: object
      description: "Multi-language text: { th, en, de }"
      properties:
        th:
          type: string
        en:
          type: string
        de:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        total_pages:
          type: integer
          example: 4

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
          description: >-
            Machine-readable error code. Admin auth codes:
            `ADMIN_INVALID_CREDENTIALS`, `ADMIN_SESSION_INVALID`,
            `ADMIN_SESSION_REUSED`.
        trace_id:
          type: string
          description: Request trace ID for correlating logs

    # ===== Auth =====
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AdminAuthResponse:
      type: object
      description: >-
        Admin login/refresh response. Contains only the in-memory access token
        and user; the refresh credential travels in the HttpOnly
        `wat_admin_refresh` cookie and is never serialized here.
      properties:
        access_token:
          type: string
          description: Short-lived Admin access token (audience `admin`)
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        email_verified:
          type: boolean
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: string
          description: 'Resource-to-action permission map, e.g. `{ "dashboard": "read" }`'
        admin_access:
          type: boolean
          description: >-
            Whether the role may use the Admin API. Admin sessions are granted
            only when `admin_access` is true; it is never inferred from the role
            name or permissions.
        is_active:
          type: boolean

    MediaMetadata:
      type: object
      properties:
        alt:
          $ref: '#/components/schemas/MultiLangText'
        caption:
          type: string
        credit:
          type: string

    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        original_filename:
          type: string
        mime_type:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
        path:
          type: string
        uploaded_by_id:
          type: string
          format: uuid
          nullable: true
        alt_text:
          type: string
        category:
          type: string
        metadata:
          $ref: '#/components/schemas/MediaMetadata'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MediaUpdateInput:
      type: object
      required: [metadata]
      properties:
        metadata:
          $ref: '#/components/schemas/MediaMetadata'

    MediaUploadResponse:
      type: object
      properties:
        url:
          type: string
        media:
          $ref: '#/components/schemas/Media'

    # ===== Event =====
    Event:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          $ref: '#/components/schemas/MultiLangText'
        description:
          $ref: '#/components/schemas/MultiLangText'
        event_date:
          type: string
          format: date-time
        start_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true
        location:
          $ref: '#/components/schemas/MultiLangText'
        image_url:
          type: string
        map_url:
          type: string
        event_type:
          type: string
          enum: [meditation_course, ceremony, festival]
        is_recurring:
          type: boolean
        recurring_pattern:
          type: string
        max_participants:
          type: integer
          nullable: true
        registration_enabled:
          type: boolean
        registration_deadline:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        display_order:
          type: integer
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/EventSchedule'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventSchedule:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: integer
        time:
          type: string
          format: date-time
        activity:
          $ref: '#/components/schemas/MultiLangText'
        display_order:
          type: integer

    EventRegistrationInput:
      type: object
      required: [first_name, last_name, email]
      properties:
        registration_type:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        dietary_restrictions:
          type: string
        special_needs:
          type: string
        additional_notes:
          type: string

    # ===== Monk =====
    Monk:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        image_url:
          type: string
        name:
          $ref: '#/components/schemas/MultiLangText'
        title:
          $ref: '#/components/schemas/MultiLangText'
        bio:
          $ref: '#/components/schemas/MultiLangText'
        ordination_date:
          type: string
          format: date-time
          nullable: true
        position:
          type: string
        display_order:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ===== Gallery =====
    GalleryCategory:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          $ref: '#/components/schemas/MultiLangText'
        display_order:
          type: integer
        is_active:
          type: boolean

    Gallery:
      type: object
      properties:
        id:
          type: integer
        image_url:
          type: string
        thumbnail_url:
          type: string
        caption:
          $ref: '#/components/schemas/MultiLangText'
        category_id:
          type: integer
          nullable: true
        category:
          $ref: '#/components/schemas/GalleryCategory'
        event_id:
          type: integer
          nullable: true
        display_order:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ===== Schedule =====
    Schedule:
      type: object
      properties:
        id:
          type: integer
        schedule_type:
          type: string
          enum: [daily, weekly, monthly]
        day_of_week:
          type: integer
          nullable: true
          description: "0=Sunday, 6=Saturday"
        time_start:
          type: string
          format: date-time
          nullable: true
        time_end:
          type: string
          format: date-time
          nullable: true
        activity:
          $ref: '#/components/schemas/MultiLangText'
        location:
          $ref: '#/components/schemas/MultiLangText'
        online_link:
          type: string
        is_active:
          type: boolean
        display_order:
          type: integer

    # ===== Donation =====
    DonationCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          $ref: '#/components/schemas/MultiLangText'
        description:
          $ref: '#/components/schemas/MultiLangText'
        is_active:
          type: boolean
        display_order:
          type: integer

    DonationInput:
      type: object
      required: [donor_type, amount]
      properties:
        donor_type:
          type: string
          enum: [member, guest, anonymous]
        donor_name:
          type: string
        donor_email:
          type: string
          format: email
        donor_phone:
          type: string
        donor_address:
          type: string
        amount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          default: EUR
        donation_date:
          type: string
          format: date
        donation_method:
          type: string
          enum: [bank_transfer, cash, paypal]
        category_id:
          type: integer
        purpose:
          $ref: '#/components/schemas/MultiLangText'
        is_anonymous:
          type: boolean
        tax_receipt_required:
          type: boolean
        notes:
          type: string

    Donation:
      type: object
      properties:
        id:
          type: integer
        receipt_number:
          type: string
        donor_type:
          type: string
        member:
          $ref: '#/components/schemas/Member'
        donor_name:
          type: string
        donor_email:
          type: string
        amount:
          type: number
        currency:
          type: string
        donation_date:
          type: string
          format: date
        donation_method:
          type: string
        category:
          $ref: '#/components/schemas/DonationCategory'
        purpose:
          $ref: '#/components/schemas/MultiLangText'
        is_anonymous:
          type: boolean
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ===== Member =====
    MemberInput:
      type: object
      required: [first_name_th, last_name_th]
      properties:
        first_name_th:
          type: string
        last_name_th:
          type: string
        first_name_en:
          type: string
        last_name_en:
          type: string
        birth_date:
          type: string
          format: date
        gender:
          type: string
        nationality:
          type: string
        address_th:
          type: string
        address_en:
          type: string
        phone:
          type: string
        line_id:
          type: string
        emergency_contact_name:
          type: string
        emergency_contact_phone:
          type: string
        membership_type:
          type: string

    Member:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
          format: uuid
        member_code:
          type: string
        first_name_th:
          type: string
        last_name_th:
          type: string
        first_name_en:
          type: string
        last_name_en:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        gender:
          type: string
        nationality:
          type: string
        phone:
          type: string
        membership_type:
          type: string
        membership_status:
          type: string
        membership_date:
          type: string
          format: date-time
        profile_image_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ===== Contact =====
    ContactInput:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        phone:
          type: string
        subject:
          type: string
          maxLength: 500
        message:
          type: string
          maxLength: 5000
        inquiry_type:
          type: string
          enum: [general, event, donation, volunteer]

    ContactInquiry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        subject:
          type: string
        message:
          type: string
        inquiry_type:
          type: string
        status:
          type: string
          enum: [new, read, replied, archived]
        replied_at:
          type: string
          format: date-time
          nullable: true
        reply_message:
          type: string
        created_at:
          type: string
          format: date-time

    # ===== Setting =====
    Setting:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        value:
          type: string
        type:
          type: string
          enum: [string, number, boolean, json]
        category:
          type: string
        is_public:
          type: boolean
