      summary: Find minimised personal-data candidates
      security: [{AdminBearerAuth: []}]
      parameters:
        - {name: email, in: query, schema: {type: string, format: email}}
        - {name: member_code, in: query, schema: {type: string}}
      responses:
        '200': {description: Candidate list without secrets}
  /admin/privacy-requests/{id}:
    get:
      tags: [Admin - Privacy]
      summary: Get a personal data request
      security: [{AdminBearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': {description: Request detail}
  /admin/privacy-requests/{id}/verify:
    post:
      tags: [Admin - Privacy]
      summary: Verify requester identity
      security: [{AdminBearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, evidence]
              properties:
                method: {type: string, enum: [email, in_person]}
                evidence: {type: string}
      responses:
        '200': {description: Request verified}
  /admin/privacy-requests/{id}/send-verification:
    post:
      tags: [Admin - Privacy]
      summary: Send an expiring email verification code
      security: [{AdminBearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': {description: Verification email sent}
        '503': {description: Email delivery is not configured}
  /admin/privacy-requests/{id}/items:
    post:
      tags: [Admin - Privacy]
      summary: Select discovered records and action
      security: [{AdminBearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': {description: Selection saved}
  /admin/privacy-requests/{id}/complete:
    post:
      tags: [Admin - Privacy]
      summary: Anonymise selected personal data
      security: [{AdminBearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': {description: Selected records anonymised}
        '409': {description: Request is not verified}
  /admin/privacy-requests/{id}/export:
    get:
      tags: [Admin - Privacy]
      summary: Download a selected-data export
      security: [{AdminBearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': {description: Private JSON export}
        '409': {description: Request is not verified}
  /admin/privacy-requests/{id}/reject:
    post:
      tags: [Admin - Privacy]
      summary: Reject a personal data request
      security: [{AdminBearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': {description: Request rejected}

  /admin/members:
    get:
      tags: [Admin - Members]
      summary: List members
      description: Query parameters support repeated values for multi-select.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: status
          in: query
          description: Status filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: type
          in: query
          description: Member type filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated members list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Member'

  /admin/members/{id}:
    get:
      tags: [Admin - Members]
      summary: Get member by ID
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Member detail
    put:
      tags: [Admin - Members]
      summary: Update member
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Member'
      responses:
        '200':
          description: Member updated

  # ==================== ADMIN - Registrations ====================
  /admin/registrations:
    get:
      tags: [Admin - Registrations]
      summary: List event registrations
      description: Query parameters support repeated values for multi-select.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: status
          in: query
          description: Status filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: event
          in: query
          description: Event ID filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated registrations list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventRegistration'

  /admin/registrations/{id}/status:
    put:
      tags: [Admin - Registrations]
      summary: Update registration status
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, attended, cancelled]
                reason:
                  type: string
      responses:
        '200':
          description: Status updated

  /admin/event-registrations:
    get:
      tags: [Admin - Registrations]
      summary: List typed group registrations
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
        - name: event_id
          in: query
          schema:
            type: array
            items:
              type: integer
        - name: registration_type
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [guest, account, member]
      responses:
        '200':
          description: Paginated group registrations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin - Registrations]
      summary: Manually create event registration
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, contact, participants]
              properties:
                event_id:
                  type: integer
                  example: 1
                locale:
                  type: string
                  enum: [th, en, de]
                  default: th
                status:
                  type: string
                  enum: [pending, confirmed, attended, cancelled]
                  default: confirmed
                contact:
                  $ref: '#/components/schemas/RegistrationContactInput'
                participants:
                  type: array
                  items:
                    $ref: '#/components/schemas/RegistrationParticipantInput'
                dietary_restrictions:
                  type: string
                special_needs:
                  type: string
                additional_notes:
                  type: string
                send_email:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Event registration created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/EventRegistrationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/event-registrations/{id}:
    get:
      tags: [Admin - Registrations]
      summary: Get typed group registration detail
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Group registration detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AdminEventRegistrationDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin - Registrations]
      summary: Edit a group registration as Admin
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEventRegistrationUpdateInput'
      responses:
        '200':
          description: Updated group registration
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin - Registrations]
      summary: Delete an event registration
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Event registration deleted successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/event-registrations/{id}/status:
    put:
      tags: [Admin - Registrations]
      summary: Set a group registration status
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEventRegistrationStatusInput'
      responses:
        '200':
          description: Status updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/event-registrations/{id}/participants/{participantId}/attendance:
    patch:
      tags: [Admin - Registrations]
      summary: Check in or undo check-in for one participant
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEventRegistrationAttendanceInput'
      responses:
        '200':
          description: Attendance updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/event-registrations/check-in:
    post:
      tags: [Admin - Registrations]
      summary: Quick check-in an attendee by confirmation code or QR code
      description: Requires `events:update` permission.
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Registration confirmation code
      responses:
        '200':
          description: Attendee checked in successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Registration is cancelled

  /admin/event-registrations/{id}/manage-link:
    post:
      tags: [Admin - Registrations]
      summary: Rotate and email a guest management link
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '202':
          description: Management link delivery queued; raw token is never returned
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # ==================== ADMIN - Contacts ====================
  /admin/contacts:
    get:
      tags: [Admin - Contacts]
      summary: List contact inquiries
      description: Query parameters support repeated values for multi-select.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: status
          in: query
          description: Status filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: type
          in: query
          description: Inquiry type filter (repeated string for multi-select)
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated contact inquiries list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ContactInquiry'

  /admin/contacts/{id}/status:
    put:
      tags: [Admin - Contacts]
      summary: Update contact status
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [new, read, replied, archived]
                reply_message:
                  type: string
      responses:
        '200':
          description: Contact status updated

  /admin/contacts/{id}:
    delete:
      tags: [Admin - Contacts]
      summary: Delete contact inquiry
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Contact deleted

  # ==================== ADMIN - Settings ====================
  /admin/settings:
    get:
      tags: [Admin - Settings]
      summary: Get all settings
      security:
        - AdminBearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Settings list
    put:
      tags: [Admin - Settings]
      summary: Batch update settings
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key:
                        type: string
                      value:
                        type: string
      responses:
        '200':
          description: Settings updated
    post:
      tags: [Admin - Settings]
      summary: Upsert a single setting
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Setting'
      responses:
        '200':
          description: Setting upserted

  /admin/backup/export:
    get:
      tags: [Admin - Settings]
      summary: Export emergency JSON database snapshot
      description: Returns a full JSON snapshot of temple data. Requires `settings:update` permission.
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Database snapshot file
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/ai/translate:
    post:
      tags: [Admin - Settings]
      summary: Translate draft text using AI (Google Gemini)
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Source text to translate
                source_lang:
                  type: string
                  enum: [th, en, de]
                  default: th
                target_langs:
                  type: array
                  items:
                    type: string
                    enum: [th, en, de]
                  default: [en, de]
      responses:
        '200':
          description: Translated text per target language
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      translations:
                        type: object
                        additionalProperties:
                          type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived Admin access token with audience `admin`. Issued only by
        `/auth/admin/login` and `/auth/admin/refresh`. Held only in memory by
        the client; never stored in browser storage. Public-account tokens
        (audience `public-account`) are rejected with 401, and accounts without
        an active Admin role are rejected with 403.
    PublicAccountBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived public-account access token with audience `public-account`.
        Issued by `/accounts/login`, `/accounts/refresh`, and the Google
        sign-in flows. Rejected by the Admin API (see AdminBearerAuth); Admin
        tokens cannot be used here.

  parameters:
    CalendarFromParam:
      name: from
      in: query
      description: Inclusive visible calendar range start (YYYY-MM-DD). The inclusive range must be no longer than 93 days.
      required: true
      schema:
        type: string
        format: date
    CalendarToParam:
      name: to
      in: query
      description: Inclusive visible calendar range end (YYYY-MM-DD). The inclusive range must be no longer than 93 days.
      required: true
      schema:
        type: string
        format: date
    CalendarLocaleParam:
      name: locale
      in: query
      description: Localized entry language
      required: true
      schema:
        type: string
        enum: [th, en, de]
    CalendarResourceParam:
      name: resourceId
      in: query
      description: Optional repeated resource slug filter
      required: false
      schema:
        type: array
        items:
          type: string

    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    MediaIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      description: Page number (1-based)
      required: false
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Number of items per page (10, 25, 50, 100)
      required: false
      schema:
        type: integer
        default: 25
        enum: [10, 25, 50, 100]
    SearchParam:
      name: search
      in: query
      description: Search string matched against text/JSONB fields
      required: false
      schema:
        type: string
    SortParam:
      name: sort
      in: query
      description: Field name to sort by
      required: false
      schema:
        type: string
    OrderParam:
      name: order
      in: query
      description: Sort direction (asc or desc)
      required: false
      schema:
        type: string
        enum: [asc, desc]
    FromParam:
      name: from
      in: query
      description: Start date filter (RFC3339 or YYYY-MM-DD)
      required: false
      schema:
        type: string
    ToParam:
      name: to
      in: query
      description: End date filter (RFC3339 or YYYY-MM-DD)
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Registration conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: Management link expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTooLarge:
      description: Request body exceeds the endpoint limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CommunityCategory:
      type: object
      required: [id, slug, name, sort_order]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { $ref: '#/components/schemas/MultiLangText' }
        description:
          allOf:
            - $ref: '#/components/schemas/MultiLangText'
          nullable: true
        sort_order: { type: integer }

    CommunityCategoryListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing CommunityCategory[] in data

    CommunityAdminCategory:
      allOf:
        - $ref: '#/components/schemas/CommunityCategory'
        - type: object
          required: [is_active]
          properties:
            is_active: { type: boolean }

    CommunityAdminCategoryListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing Admin Community categories

    CommunityCategoryInput:
      type: object
      required: [slug, name, sort_order, is_active]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 2, maxLength: 80 }
        name: { $ref: '#/components/schemas/MultiLangText' }
        description: { $ref: '#/components/schemas/MultiLangText' }
        sort_order: { type: integer, minimum: 0, maximum: 100000 }
        is_active: { type: boolean }

    CommunityCategoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing one Community category

    CommunityAdminCategoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing one Admin Community category

    CommunityQuestionListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing cursor-paginated Community questions in data

    CommunityQuestionDetailResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing a Community question detail in data

    CommunityRichTextDocument:
      type: object
      description: Restricted Tiptap document accepted by Community mutations
      required: [type]
      properties:
        type: { type: string, enum: [doc] }
        content:
          type: array
          items: { type: object, additionalProperties: true }

    CommunityCreateQuestionRequest:
      type: object
      required: [category_id, locale, title, body]
      properties:
        category_id: { type: string, format: uuid }
        locale: { type: string, enum: [th, en, de] }
        title: { type: string, minLength: 10, maxLength: 200 }
        body: { $ref: '#/components/schemas/CommunityRichTextDocument' }
        client_request_id: { type: string, format: uuid, description: Must match Idempotency-Key when supplied }

    CommunityUpdateQuestionRequest:
      type: object
      required: [title, body, expected_version]
      properties:
        title: { type: string, minLength: 10, maxLength: 200 }
        body: { $ref: '#/components/schemas/CommunityRichTextDocument' }
        expected_version: { type: integer, minimum: 1 }

    CommunityQuestionMutationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing the authoritative question mutation state

    CommunityMemberActivityResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing the authenticated member's own questions

    CommunityViewerStateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing viewer-only action flags

    CommunityCreateAnswerRequest:
      type: object
      required: [body]
      properties:
        body: { $ref: '#/components/schemas/CommunityRichTextDocument' }
        client_request_id: { type: string, format: uuid }

    CommunityCreateCommentRequest:
      type: object
      required: [body]
      properties:
        answer_id: { type: string, format: uuid, nullable: true }
        body: { $ref: '#/components/schemas/CommunityRichTextDocument' }
        client_request_id: { type: string, format: uuid }

    CommunityUpdateAnswerRequest:
      type: object
      required: [body, expected_version]
      properties:
        body: { $ref: '#/components/schemas/CommunityRichTextDocument' }
        expected_version: { type: integer, minimum: 1 }

    CommunityUpdateCommentRequest:
      type: object
      required: [body, expected_version]
      properties:
        body: { $ref: '#/components/schemas/CommunityRichTextDocument' }
        expected_version: { type: integer, minimum: 1 }

    CommunityAnswerMutationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing an answer mutation

    CommunityCommentMutationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing a comment mutation

    CommunityAcceptanceResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing accepted-answer state

    CommunityHelpfulResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing helpful-vote state

    CommunityCreateReportRequest:
      type: object
      required: [reason]
      properties:
        question_id: { type: string, format: uuid, nullable: true }
        answer_id: { type: string, format: uuid, nullable: true }
        comment_id: { type: string, format: uuid, nullable: true }
        reason: { type: string, enum: [spam, harassment, misinformation, privacy, inappropriate, other] }
        details: { type: string, maxLength: 2000 }

    CommunityReportResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing a report

    CommunityModerationRequest:
      type: object
      required: [action, reason]
      properties:
        action: { type: string }
        reason: { type: string, minLength: 2, maxLength: 2000 }

    CommunityReportDecisionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 2, maxLength: 2000 }

    CommunityModerationQueueResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      description: Success envelope containing pending items and reports

    CommunityNotificationPageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CommunityNotificationPage' }
      description: Success envelope containing notifications, cursor, and unread count

    CommunityNotificationPreferencesResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CommunityNotificationPreferences' }
      description: Success envelope containing the authenticated member's email preferences

    CommunityNotificationPage:
      type: object
      required: [items, unread_count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CommunityNotification' }
        next_cursor: { type: string }
        unread_count: { type: integer, minimum: 0 }

    CommunityNotification:
      type: object
      required: [id, event_type, target_type, created_at]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string, enum: [community.answer.created, community.comment.created, community.accepted, community.helpful, community.official, community.approval, community.revision, community.moderation] }
        target_type: { type: string }
        target_id: { type: string, format: uuid, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CommunityNotificationPreferences:
      type: object
      required: [email_preferences]
      properties:
        email_preferences:
          type: object
          additionalProperties: { type: boolean }

    CommunityRevisionDecisionRequest:
      type: object
      required: [approve, reason]
      properties:
        approve: { type: boolean }
        reason: { type: string, minLength: 2, maxLength: 2000 }

    # ===== Common =====
    MultiLangText:
      type: object
      description: "Multi-language text: { th, en, de }"
      properties:
        th:
          type: string
        en:
          type: string
        de:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 25
        total:
          type: integer
          example: 100
        total_pages:
          type: integer
          example: 4

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
          description: >-
            Machine-readable error code. Admin auth codes:
            `ADMIN_INVALID_CREDENTIALS`, `ADMIN_SESSION_INVALID`,
            `ADMIN_SESSION_REUSED`. Public account codes:
            `AUTH_INVALID_CREDENTIALS`, `AUTH_EMAIL_VERIFICATION_REQUIRED`,
            `AUTH_TOKEN_INVALID_OR_EXPIRED`, `AUTH_RATE_LIMITED`,
            `AUTH_ACCOUNT_DISABLED`, `AUTH_REAUTH_REQUIRED`,
            `AUTH_EMAIL_ALREADY_REGISTERED`, `AUTH_VALIDATION`,
            `AUTH_GOOGLE_EMAIL_MISMATCH`, `AUTH_GOOGLE_IDENTITY_IN_USE`,
            `AUTH_GOOGLE_ALREADY_LINKED`, `AUTH_GOOGLE_LINK_PENDING`,
            `AUTH_INTERNAL`. Event registration codes include
            `REGISTRATION_DISABLED`, `REGISTRATION_CLOSED`, `EVENT_FULL`,
            `ALREADY_REGISTERED`, `GROUP_LIMIT_EXCEEDED`, `VALIDATION_ERROR`,
            `MANAGE_TOKEN_INVALID`, `MANAGE_TOKEN_EXPIRED`,
            `REGISTRATION_NOT_EDITABLE`, `REGISTRATION_NOT_FOUND`,
            `REGISTRATION_UNAUTHORIZED`, and `REGISTRATION_CONFLICT`.
        retry_after_seconds:
          type: integer
          minimum: 0
          description: >-
            Seconds until the caller may retry, present for cooldown responses
            such as `AUTH_GOOGLE_LINK_PENDING`.
        field_errors:
          type: array
          description: >-
            Field-level validation failures, present for `AUTH_VALIDATION`
            responses from the public account API.
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        fields:
          type: object
          description: >-
            Field-level validation messages for donation and other form
            submissions. Keys are request field names and values are messages.
          additionalProperties:
            type: string
        trace_id:
          type: string
          description: Request trace ID for correlating logs

    # ===== Auth =====
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AdminAuthResponse:
      type: object
      description: >-
        Admin login/refresh response. Contains only the in-memory access token
        and user; the refresh credential travels in the HttpOnly
        `wat_admin_refresh` cookie and is never serialized here.
      properties:
        access_token:
          type: string
          description: Short-lived Admin access token (audience `admin`)
        user:
          $ref: '#/components/schemas/User'

    # ===== Public Account =====
    AccountRegisterInput:
      type: object
      required: [email, password, display_name, locale]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 2
          maxLength: 80
        locale:
          type: string
          enum: [th, en, de]

    AccountLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AccountEmailInput:
      type: object
      required: [email, locale]
      properties:
        email:
          type: string
          format: email
        locale:
          type: string
          enum: [th, en, de]

    AccountTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Single-use action token (from email link)

    AccountResetPasswordInput:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 12
          maxLength: 128

    AccountEmptyInput:
      type: object
      description: Empty payload; protected actions use the shared re-authentication endpoint first.

    AccountReauthenticateInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Current password used to establish recent authentication

    AccountPasswordChangeInput:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 12
          maxLength: 128

    AccountEmailChangeInput:
      type: object
      required: [new_email, locale]
      properties:
        new_email:
          type: string
          format: email
        locale:
          type: string
          enum: [th, en, de]

    AccountSessionResponse:
      type: object
      description: >-
        Public account session start/rotation response. Contains only the
        short-lived access token; the rotating refresh token travels in the
        HttpOnly `wat_public_refresh` cookie and is never serialized here.
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
              description: Short-lived access token (audience `public-account`)
            expires_in:
              type: integer
              description: Access token lifetime in seconds

    AccountGoogleStartResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            authorization_url:
              type: string
              description: Google OAuth authorization URL (browser redirect)

    GoogleLinkStatus:
      type: object
      description: >-
        Google identity link state for the current account. Used by
        `/accounts/google/link/status`.
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            connected:
              type: boolean
              description: Whether a Google identity is connected to the account
            pending:
              type: boolean
              description: Whether a link-approval email is waiting on the account email
            retry_after_seconds:
              type: integer
              minimum: 0
              description: >-
                Remaining seconds before another approval email may be
                requested; zero when no approval is pending

    AccountProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            email_verified:
              type: boolean
            account_status:
              type: string
              enum: [pending_verification, active, disabled, closed]
            display_name:
              type: string
            avatar_url:
              type: string
            preferred_locale:
              type: string
              enum: [th, en, de]
            providers:
              type: array
              items:
                type: string
              description: Linked identity providers, e.g. `password`, `google`
            purge_after:
              type: string
              format: date-time
              nullable: true
              description: Permanent deletion deadline for a closed account

    AccountProfileUpdateInput:
      type: object
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 80
        avatar_url:
          type: string
        preferred_locale:
          type: string
          enum: [th, en, de]

    AccountClosureResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [purge_after]
          properties:
            purge_after:
              type: string
              format: date-time
              description: Permanent deletion deadline; the account can be restored before this time

    AccountSessionsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            sessions:
              type: array
              description: Session summaries; token hashes are never serialized
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  current:
                    type: boolean
                  user_agent_summary:
                    type: string
                  ip_prefix:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  last_used_at:
                    type: string
                    format: date-time
                  expires_at:
                    type: string
                    format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        email_verified:
          type: boolean
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: string
          description: 'Resource-to-action permission map, e.g. `{ "dashboard": "read" }`'
        admin_access:
          type: boolean
          description: >-
            Whether the role may use the Admin API. Admin sessions are granted
            only when `admin_access` is true; it is never inferred from the role
            name or permissions.
        is_system:
          type: boolean
          description: Whether the role is a protected system role that cannot be deleted or renamed.
        is_active:
          type: boolean

    AdminProfileUpdateInput:
      type: object
      description: >-
        Self-service profile update for the signed-in admin. Supply
        `current_password` and `new_password` together to rotate the password;
        this revokes all other admin sessions for the user.
      properties:
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: string
          nullable: true
        current_password:
          type: string
          description: Required when setting a new password.
        new_password:
          type: string
          minLength: 8
          description: Required when rotating the password.

    AdminAccountSummary:
      type: object
      description: Safe public-account projection for Admin operations.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        account_status:
          type: string
          enum: [pending_verification, active, disabled, closed]
        email_verified:
          type: boolean
        providers:
          type: array
          items:
            type: string
            enum: [password, google]
        last_login_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        purge_after:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    AdminAccountSecurityEvent:
      type: object
      description: Redacted event projection; no IP, trace, metadata, or credentials.
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        outcome:
          type: string
        provider:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    AdminAccountMutationInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [security_review, policy_violation, user_request, support_request]
          description: Allow-listed reason for the staff operation.

    MediaMetadata:
      type: object
      properties:
        alt:
          $ref: '#/components/schemas/MultiLangText'
        caption:
          type: string
        credit:
          type: string

    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        original_filename:
          type: string
        mime_type:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
        path:
          type: string
        uploaded_by_id:
          type: string
          format: uuid
          nullable: true
        alt_text:
          type: string
        alt_texts:
          $ref: '#/components/schemas/MultiLangText'
        category:
          type: string
        metadata:
          $ref: '#/components/schemas/MediaMetadata'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        deleted_by_id:
          type: string
          format: uuid
          nullable: true
        purge_at:
          type: string
          format: date-time
          nullable: true

    MediaReference:
      type: object
      required: [kind, id, label, href]
      properties:
        kind:
          type: string
        id:
          type: string
        label:
          type: string
        href:
          type: string

    MediaUpdateInput:
      type: object
      required: [metadata]
      properties:
        metadata:
          $ref: '#/components/schemas/MediaMetadata'

    MediaUploadResponse:
      type: object
      properties:
        url:
          type: string
        media:
          $ref: '#/components/schemas/Media'

    # ===== Event =====
    EventCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          $ref: '#/components/schemas/MultiLangText'
        description:
          $ref: '#/components/schemas/MultiLangText'
        is_active:
          type: boolean
        display_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Event:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          $ref: '#/components/schemas/MultiLangText'
        description:
          $ref: '#/components/schemas/MultiLangText'
        event_date:
          type: string
          format: date-time
        start_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true
        location:
          $ref: '#/components/schemas/MultiLangText'
        image_url:
          type: string
        map_url:
          type: string
        category_id:
          type: integer
          nullable: true
        category:
          $ref: '#/components/schemas/EventCategory'
        event_type:
          type: string
          enum: [meditation_course, ceremony, festival]
        is_recurring:
          type: boolean
        recurring_pattern:
          type: string
        max_participants:
          type: integer
          nullable: true
        registration_enabled:
          type: boolean
        registration_deadline:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        publish_status:
          type: string
          enum: [draft, scheduled, published, archived]
          default: published
        published_at:
          type: string
          format: date-time
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        display_order:
          type: integer
        gallery_urls:
          type: array
          items:
            type: string
        online_join_url:
          type: string
        dress_code:
          $ref: '#/components/schemas/MultiLangText'
        what_to_bring:
          $ref: '#/components/schemas/MultiLangText'
        donation_enabled:
          type: boolean
        contact_phone:
          type: string
        contact_line:
          type: string
        contact_email:
          type: string
        transport_info:
          $ref: '#/components/schemas/MultiLangText'
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/EventSchedule'
        resource_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
          description: Active calendar resource IDs to assign to the event
        resource_assignments:
          type: array
          readOnly: true
          items:
            type: object
            required: [event_id, resource_id]
            properties:
              event_id:
                type: integer
              resource_id:
                type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CalendarFeed:
      type: object
      required: [scope, locale, timezone, range, entries, resources]
      properties:
        scope:
          type: string
          enum: [public, admin]
        locale:
          type: string
          enum: [th, en, de]
        timezone:
          type: string
          enum: [Europe/Berlin]
        range:
          $ref: '#/components/schemas/CalendarRange'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEntry'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/CalendarResource'

    CalendarRange:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    CalendarEntry:
      type: object
      required: [id, source, title, start, end, allDay, status, display, detail]
      properties:
        id:
          type: string
        source:
          type: string
        title:
          type: string
        start:
          type: string
          description: Europe/Berlin ISO datetime for timed entries, or YYYY-MM-DD for all-day entries
        end:
          type: string
          description: Europe/Berlin ISO datetime for timed entries; exclusive YYYY-MM-DD boundary for all-day entries
        allDay:
          type: boolean
        resourceId:
          type: string
        resourceIds:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, inactive]
        display:
          type: object
          required: [tone]
          properties:
            tone:
              type: string
              enum: [default, muted, warning]
        detail:
          type: object
          required: [canEdit]
          properties:
            href:
              type: string
            editorHref:
              type: string
            canEdit:
              type: boolean
            description:
              type: string
              description: Localized event description when available
            location:
              type: string
              description: Localized event location when available

    CalendarResource:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        color:
          type: string
        group:
          type: string

    CalendarResourceInput:
      type: object
      required: [slug, resource_type, title]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 100
        resource_type:
          type: string
          maxLength: 50
        title:
          type: object
          required: [th, en, de]
          properties:
            th:
              type: string
            en:
              type: string
            de:
              type: string
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        capacity:
          type: integer
          minimum: 1
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        is_active:
          type: boolean
          default: true
        is_public:
          type: boolean
          default: false
        display_order:
          type: integer
          minimum: 0

    CalendarResourceAdmin:
      allOf:
        - $ref: '#/components/schemas/CalendarResourceInput'
        - type: object
          required: [id, assignment_count, created_at, updated_at]
          properties:
            id:
              type: integer
