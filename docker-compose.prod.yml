version: "3.8"

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wat_profile}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wat_profile}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wat_network

  # 2. Go Fiber Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wat_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"
      ENV: "production"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-wat_profile}?sslmode=disable"
      DB_AUTO_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - wat_network

  # 3. Operations Background Worker (Outbox, Email, Retention)
  operations-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wat_operations_worker
    command: ["/app/operations-worker"]
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ENV: "production"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-wat_profile}?sslmode=disable"
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - wat_network

  # 4. Next.js Frontend Standalone Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.watloungporsai.de}
        NEXT_PUBLIC_MEDIA_ALLOWED_ORIGINS: ${NEXT_PUBLIC_MEDIA_ALLOWED_ORIGINS:-https://pub-6a058faa22bc41b8b701533c372288a3.r2.dev}
        NEXT_PUBLIC_PUBLIC_ACCOUNT_AUTH_ENABLED: ${NEXT_PUBLIC_PUBLIC_ACCOUNT_AUTH_ENABLED:-false}
        NEXT_PUBLIC_COMMUNITY_ENABLED: ${NEXT_PUBLIC_COMMUNITY_ENABLED:-false}
    container_name: wat_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: "production"
      PORT: "3000"
    depends_on:
      - backend
    networks:
      - wat_network

  # 5. Caddy Reverse Proxy (Automatic HTTPS via Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    container_name: wat_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - wat_network

volumes:
  postgres_data:
    name: wat_postgres_data
  caddy_data:
    name: wat_caddy_data
  caddy_config:
    name: wat_caddy_config

networks:
  wat_network:
    name: wat_network
    driver: bridge
