<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .canvas { fill: #fbfbfa; }
      .surface { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .text-title { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #242424; }
      .text-muted { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #666666; }
      .text-body { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #333333; }
      .text-accent { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #945c26; font-weight: 600; }
      .btn-verify { fill: #15803d; }
      .btn-reject { fill: #b91c1c; }
      .btn-text { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background Canvas (Register Paper) -->
  <rect width="800" height="480" class="canvas" />

  <!-- Main Modal (0px radius, 1px border) -->
  <rect x="40" y="25" width="720" height="430" class="surface" />

  <!-- Modal Header -->
  <rect x="40" y="25" width="720" height="50" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
  <text x="65" y="56" class="text-title">🧾 ตรวจสอบหลักฐานการโอนเงิน (Donation Proof Verification)</text>
  
  <!-- Close Button (Square) -->
  <rect x="715" y="38" width="24" height="24" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <path d="M721 44 L733 56 M733 44 L721 56" stroke="#333333" stroke-width="1.5" />

  <!-- Left: Slip Mockup (Square, Hairline Border) -->
  <rect x="65" y="95" width="290" height="335" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  
  <rect x="85" y="115" width="250" height="60" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
  <text x="100" y="140" font-family="sans-serif" font-weight="bold" font-size="12" fill="#15803d">ธนาคารกรุงไทย (KTB)</text>
  <text x="100" y="158" font-family="sans-serif" font-size="11" fill="#166534">โอนเงินสำเร็จ • บัญชีวัดพุทธบารมี</text>

  <!-- Slip Details -->
  <text x="100" y="205" class="text-muted">จำนวนเงินโอน:</text>
  <text x="100" y="232" font-family="sans-serif" font-weight="700" font-size="22" fill="#242424">฿ 2,500.00</text>

  <line x1="85" y1="248" x2="335" y2="248" stroke="#e5e7eb" stroke-width="1" />

  <text x="100" y="270" class="text-muted">บัญชีปลายทาง:</text>
  <text x="100" y="288" class="text-body" font-weight="600">วัดพุทธบารมี (049-x-xxxxx-x)</text>

  <text x="100" y="318" class="text-muted">วัน-เวลา:</text>
  <text x="100" y="336" class="text-body">19 ส.ค. 2026, 08:14 น.</text>

  <rect x="100" y="358" width="130" height="28" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
  <text x="110" y="376" font-family="monospace" font-size="11" fill="#666666">REF: #2608190814</text>

  <!-- Right: Verification Checklist -->
  <rect x="380" y="95" width="355" height="255" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <rect x="380" y="95" width="355" height="38" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
  <text x="398" y="119" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">📋 รายการตรวจสอบความถูกต้อง 3 จุดสำคัญ</text>

  <!-- Point 1 -->
  <rect x="400" y="152" width="16" height="16" fill="#15803d" />
  <path d="M403 160 L407 164 L413 156" stroke="#ffffff" stroke-width="2" fill="none" />
  <text x="426" y="157" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">1. ยอดเงินโอน</text>
  <text x="426" y="174" class="text-muted">ตรงกับยอดที่บันทึกในระบบ (2,500.00 บาท)</text>

  <!-- Point 2 -->
  <rect x="400" y="202" width="16" height="16" fill="#15803d" />
  <path d="M403 210 L407 214 L413 206" stroke="#ffffff" stroke-width="2" fill="none" />
  <text x="426" y="207" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">2. บัญชีปลายทางวัด</text>
  <text x="426" y="224" class="text-muted">โอนเข้าบัญชีธนาคารทางการของวัดถูกต้อง</text>

  <!-- Point 3 -->
  <rect x="400" y="252" width="16" height="16" fill="#15803d" />
  <path d="M403 260 L407 264 L413 256" stroke="#ffffff" stroke-width="2" fill="none" />
  <text x="426" y="257" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">3. เปรียบเทียบกับ Statement วัด</text>
  <text x="426" y="274" class="text-muted">มียอดเงินเข้าจริง ณ วันและเวลาที่ระบุ</text>

  <!-- Terracotta Alert -->
  <rect x="380" y="300" width="355" height="38" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
  <text x="395" y="323" class="text-accent">🔒 Private Asset: สลิปนี้เข้ารหัสเข้าถึงเฉพาะเจ้าหน้าที่การเงิน</text>

  <!-- Action Buttons (Square corners, min 44px target) -->
  <g transform="translate(380, 370)">
    <rect x="0" y="0" width="170" height="44" class="btn-verify" />
    <text x="28" y="27" class="btn-text">✓ ยืนยันยอดเงิน (Verify)</text>

    <rect x="185" y="0" width="170" height="44" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" />
    <text x="215" y="27" font-family="sans-serif" font-weight="700" font-size="13" fill="#b91c1c">✕ ปฏิเสธสลิป (Reject)</text>
  </g>
</svg>
