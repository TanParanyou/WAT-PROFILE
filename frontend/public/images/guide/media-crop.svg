<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .canvas { fill: #fbfbfa; }
      .surface { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .text-title { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #242424; }
      .text-muted { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #666666; }
      .text-body { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #333333; }
      .crop-handle { fill: #ffffff; stroke: #242424; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="800" height="480" class="canvas" />

  <rect x="40" y="25" width="720" height="430" class="surface" />

  <!-- Header -->
  <rect x="40" y="25" width="720" height="50" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
  <text x="65" y="56" class="text-title">✂️ เครื่องมือตัดครอบรูปภาพ (Image Crop &amp; Aspect Ratio Tool)</text>

  <!-- Left: Image Canvas with Crop Box -->
  <rect x="65" y="95" width="420" height="335" fill="#242424" stroke="#333333" stroke-width="1" />
  
  <!-- Outer dimmed area -->
  <rect x="85" y="115" width="380" height="295" fill="#475569" opacity="0.3" />
  
  <!-- Active 16:9 Crop Box (Square corners, 1.5px rule) -->
  <rect x="105" y="145" width="340" height="191" fill="#fbfbfa" stroke="#ffffff" stroke-width="2" />
  
  <!-- Mock Photo inside Crop Box -->
  <path d="M 115 320 L 180 230 L 245 290 L 315 200 L 435 320 Z" fill="#cbd5e1" />
  <circle cx="395" cy="200" r="22" fill="#945c26" />
  
  <!-- Grid Rule of Thirds (1px hairline) -->
  <line x1="218" y1="145" x2="218" y2="336" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />
  <line x1="331" y1="145" x2="331" y2="336" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />
  <line x1="105" y1="208" x2="445" y2="208" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />
  <line x1="105" y1="272" x2="445" y2="272" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Square Corner Handles (0px radius) -->
  <rect x="100" y="140" width="10" height="10" class="crop-handle" />
  <rect x="440" y="140" width="10" height="10" class="crop-handle" />
  <rect x="100" y="331" width="10" height="10" class="crop-handle" />
  <rect x="440" y="331" width="10" height="10" class="crop-handle" />

  <!-- Right: Preset Ratio Options -->
  <g transform="translate(510, 95)">
    <rect x="0" y="0" width="225" height="335" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <rect x="0" y="0" width="225" height="40" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
    <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">สัดส่วนภาพ (Aspect Ratio)</text>

    <!-- Selected 16:9 -->
    <rect x="15" y="55" width="195" height="44" fill="#242424" />
    <text x="28" y="82" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">✓ 16:9 แบนเนอร์ / ปกข่าว</text>

    <!-- 1:1 -->
    <rect x="15" y="110" width="195" height="44" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="28" y="137" font-family="sans-serif" font-size="13" fill="#333333">1:1 โปรไฟล์พระสงฆ์ / โลโก้</text>

    <!-- 4:3 -->
    <rect x="15" y="165" width="195" height="44" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="28" y="192" font-family="sans-serif" font-size="13" fill="#333333">4:3 อัลบั้มภาพกิจกรรม</text>

    <!-- Save Button (44px target) -->
    <rect x="15" y="270" width="195" height="44" fill="#15803d" />
    <text x="55" y="297" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">✓ บันทึกรูปภาพ</text>
  </g>
</svg>
