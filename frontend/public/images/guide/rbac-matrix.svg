<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .canvas { fill: #fbfbfa; }
      .surface { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .text-title { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #242424; }
      .text-muted { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #666666; }
      .text-body { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #333333; }
      .th-header { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #666666; }
    </style>
  </defs>

  <rect width="800" height="480" class="canvas" />

  <!-- Main Container -->
  <rect x="40" y="25" width="720" height="430" class="surface" />

  <!-- Header -->
  <rect x="40" y="25" width="720" height="50" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
  <text x="65" y="56" class="text-title">🛡️ การกำหนดสิทธิ์แบบละเอียด (RBAC Granular Permissions Matrix)</text>

  <!-- Table Container -->
  <g transform="translate(65, 95)">
    <!-- Header Row -->
    <rect x="0" y="0" width="670" height="38" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
    <text x="20" y="24" class="th-header">โมดูลระบบ (Resource)</text>
    <text x="230" y="24" class="th-header">อ่าน (Read)</text>
    <text x="340" y="24" class="th-header">สร้าง (Create)</text>
    <text x="450" y="24" class="th-header">แก้ไข (Update)</text>
    <text x="560" y="24" class="th-header">ลบ (Delete)</text>

    <!-- Row 1: Donations -->
    <rect x="0" y="38" width="670" height="52" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="20" y="65" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">💰 เงินบริจาค (donations)</text>
    <text x="20" y="80" class="text-muted">ตรวจสลิปและใบอนุโมทนาบัตร</text>
    
    <rect x="245" y="52" width="22" height="22" fill="#15803d" />
    <path d="M250 63 L254 67 L262 57" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <rect x="355" y="52" width="22" height="22" fill="#15803d" />
    <path d="M360 63 L364 67 L372 57" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <rect x="465" y="52" width="22" height="22" fill="#15803d" />
    <path d="M470 63 L474 67 L482 57" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <rect x="575" y="52" width="22" height="22" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />

    <!-- Row 2: Events -->
    <rect x="0" y="90" width="670" height="52" fill="#fcfcfb" stroke="#e5e7eb" stroke-width="1" />
    <text x="20" y="117" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">📅 กิจกรรมวัด (events)</text>
    <text x="20" y="132" class="text-muted">สร้างกิจกรรมและเปิดรับลงทะเบียน</text>
    
    <rect x="245" y="104" width="22" height="22" fill="#15803d" />
    <path d="M250 115 L254 119 L262 109" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <rect x="355" y="104" width="22" height="22" fill="#15803d" />
    <path d="M360 115 L364 119 L372 109" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <rect x="465" y="104" width="22" height="22" fill="#15803d" />
    <path d="M470 115 L474 119 L482 109" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <rect x="575" y="104" width="22" height="22" fill="#b91c1c" />
    <path d="M580 115 L584 119 L592 109" stroke="#ffffff" stroke-width="2.5" fill="none" />

    <!-- Row 3: Users & Roles -->
    <rect x="0" y="142" width="670" height="52" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="20" y="169" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">👥 ผู้ใช้งาน &amp; สิทธิ์ (users/roles)</text>
    <text x="20" y="184" class="text-muted">ความปลอดภัยระดับ Super Admin</text>
    
    <rect x="245" y="156" width="22" height="22" fill="#15803d" />
    <path d="M250 167 L254 171 L262 161" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <rect x="355" y="156" width="22" height="22" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <rect x="465" y="156" width="22" height="22" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <rect x="575" y="156" width="22" height="22" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />

    <!-- Summary Box (Terracotta & Ink Styling) -->
    <rect x="0" y="210" width="670" height="95" fill="#f7ecdd" stroke="#945c26" stroke-width="1" />
    <text x="20" y="235" font-family="sans-serif" font-weight="700" font-size="13" fill="#945c26">📌 กฎความปลอดภัยตามหลัก Principle of Least Privilege:</text>
    <text x="20" y="258" font-family="sans-serif" font-size="12" fill="#333333">• มอบเฉพาะสิทธิ์ที่จำเป็นต่อหน้าที่ (เช่น ฝ่ายกิจกรรมไม่ควรมีสิทธิ์เข้าถึงบัญชีการเงินหรือ Users)</text>
    <text x="20" y="278" font-family="sans-serif" font-size="12" fill="#333333">• สิทธิ์การลบ (Delete) ควรจำกัดเฉพาะเจ้าอาวาสและผู้ดูแลระบบหลักเท่านั้น</text>
  </g>
</svg>
