<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .canvas { fill: #fbfbfa; }
      .surface { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .text-title { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #242424; }
      .text-muted { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #666666; }
      .text-body { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #333333; }
      .pali-text { font-family: "Noto Sans Thai", "Palatino", serif; font-size: 14px; font-weight: 600; fill: #945c26; }
    </style>
  </defs>

  <rect width="800" height="480" class="canvas" />

  <rect x="40" y="25" width="720" height="430" class="surface" />

  <!-- Header -->
  <rect x="40" y="25" width="720" height="50" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
  <text x="65" y="56" class="text-title">📿 การจัดการบทสวดมนต์และพระธรรม (Chanting &amp; Prayers Management)</text>

  <!-- Left: Chanting Editor Card -->
  <g transform="translate(65, 95)">
    <rect x="0" y="0" width="410" height="335" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <rect x="0" y="0" width="410" height="38" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
    <text x="15" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">📝 แก้ไขบทสวดมนต์ (Chanting Form)</text>

    <!-- Field 1: Title -->
    <g transform="translate(15, 50)">
      <text x="0" y="0" font-family="sans-serif" font-weight="700" font-size="12" fill="#242424">ชื่อบทสวดมนต์ (Title) *</text>
      <rect x="0" y="10" width="380" height="38" fill="#fcfcfb" stroke="#d1d5db" stroke-width="1" />
      <text x="12" y="34" class="text-body">บทสวดทำวัตรเช้า (Morning Chanting)</text>
    </g>

    <!-- Field 2: Pali Text -->
    <g transform="translate(15, 115)">
      <text x="0" y="0" font-family="sans-serif" font-weight="700" font-size="12" fill="#242424">คำบาลี / คำสวด (Pali Text) *</text>
      <rect x="0" y="10" width="380" height="55" fill="#fcfcfb" stroke="#d1d5db" stroke-width="1" />
      <text x="12" y="32" class="pali-text">โย โส สุขะโต อะระหัง สัมมาสัมพุทโธ...</text>
      <text x="12" y="52" class="text-muted">Yo so sugato araham samma-sambuddho...</text>
    </g>

    <!-- Field 3: Audio Attachment -->
    <g transform="translate(15, 195)">
      <text x="0" y="0" font-family="sans-serif" font-weight="700" font-size="12" fill="#242424">ไฟล์เสียงสวดมนต์ (Audio File MP3)</text>
      <rect x="0" y="10" width="380" height="42" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
      <text x="12" y="36" class="text-body">▶ 00:00 / 08:45 • morning_chanting.mp3</text>
    </g>

    <!-- Save Button (44px target) -->
    <rect x="15" y="270" width="380" height="44" fill="#15803d" />
    <text x="145" y="297" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">✓ บันทึกบทสวดมนต์</text>
  </g>

  <!-- Right: Categories & Preview -->
  <g transform="translate(495, 95)">
    <rect x="0" y="0" width="240" height="335" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <rect x="0" y="0" width="240" height="38" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
    <text x="15" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">🏷️ หมวดหมู่บทสวด</text>

    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="210" height="40" fill="#242424" />
      <text x="12" y="25" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff">✓ ทำวัตรเช้า-เย็น (Daily)</text>

      <rect x="0" y="50" width="210" height="40" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
      <text x="12" y="75" font-family="sans-serif" font-size="12" fill="#333333">พระปริตรและคุ้มครอง (Paritta)</text>

      <rect x="0" y="100" width="210" height="40" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
      <text x="12" y="125" font-family="sans-serif" font-size="12" fill="#333333">บทสวดพิเศษและวันพระ</text>

      <rect x="0" y="150" width="210" height="40" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
      <text x="12" y="175" font-family="sans-serif" font-size="12" fill="#333333">พระสูตรและพระอภิธรรม</text>
    </g>

    <!-- Notice Box -->
    <rect x="15" y="260" width="210" height="60" fill="#f7ecdd" stroke="#945c26" stroke-width="1" />
    <text x="25" y="280" font-family="sans-serif" font-size="11" fill="#945c26" font-weight="700">📱 รองรับทุกหน้าจอ</text>
    <text x="25" y="298" font-family="sans-serif" font-size="10" fill="#333333">แสดงผลตัวอักษรขนาดใหญ่อ่านง่ายบนมือถือขณะสวดมนต์</text>
  </g>
</svg>
