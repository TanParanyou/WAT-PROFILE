<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .canvas { fill: #fbfbfa; }
      .surface { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .text-title { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #242424; }
      .text-muted { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #666666; }
      .text-body { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #333333; }
      .seal { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="800" height="480" class="canvas" />

  <rect x="40" y="25" width="720" height="430" class="surface" />

  <!-- Header -->
  <rect x="40" y="25" width="720" height="50" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
  <text x="65" y="56" class="text-title">📜 ระบบออกเอกสารทางการและใบอนุโมทนาบัตร (Official Certificates &amp; Tax Forms)</text>

  <!-- Left: Certificate Preview Sheet (A4 Proportion) -->
  <g transform="translate(65, 95)">
    <rect x="0" y="0" width="410" height="335" fill="#ffffff" stroke="#242424" stroke-width="1.5" />
    
    <!-- Certificate Border Frame -->
    <rect x="10" y="10" width="390" height="315" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 2" />

    <!-- Temple Logo / Seal Icon -->
    <g transform="translate(30, 25)">
      <circle cx="20" cy="20" r="18" fill="#f7ecdd" stroke="#945c26" stroke-width="1" />
      <text x="14" y="25" font-family="serif" font-size="14" fill="#945c26" font-weight="bold">☸</text>
      <text x="50" y="18" font-family="sans-serif" font-weight="700" font-size="12" fill="#242424">วัดพุทธบารมี ฮัมบวร์ก เยอรมนี</text>
      <text x="50" y="32" class="text-muted">Wat Buddhabharami Hamburg e.V.</text>
    </g>

    <!-- Certificate Title -->
    <text x="205" y="85" font-family="sans-serif" font-weight="700" font-size="14" fill="#242424" text-anchor="middle">ใบอนุโมทนาบัตร (Zuwendungsbestätigung)</text>

    <!-- Certificate Body Details -->
    <g transform="translate(30, 110)">
      <text x="0" y="0" class="text-muted">ขออนุโมทนาแก่ (Zuwendungsempfänger):</text>
      <text x="0" y="18" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">คุณสมศักดิ์ สุขเจริญ (Herr Somsak Sukcharoen)</text>
      
      <text x="0" y="45" class="text-muted">จำนวนเงินบริจาค (Betrag):</text>
      <text x="0" y="63" font-family="sans-serif" font-weight="700" font-size="15" fill="#15803d">€ 500.00 EUR (หนึ่งหมื่นแปดพันบาทถ้วน)</text>

      <text x="0" y="90" class="text-muted">เพื่อวัตถุประสงค์ (Verwendungszweck):</text>
      <text x="0" y="108" class="text-body">สมทบทุนค่าน้ำ-ค่าไฟและบำรุงพระพุทธศาสนา</text>
    </g>

    <!-- Bottom: Signatures and Temple Seal -->
    <g transform="translate(30, 245)">
      <!-- Signature Pad Mock -->
      <rect x="0" y="0" width="160" height="50" fill="#fcfcfb" stroke="#d1d5db" stroke-width="1" />
      <path d="M 15 35 Q 45 10, 75 30 T 135 25" fill="none" stroke="#242424" stroke-width="1.5" />
      <text x="15" y="62" class="text-muted">ลายเซ็นเจ้าอาวาส / ไวยาวัจกร</text>

      <!-- Temple Red Seal (0px sharp box) -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="100" height="50" class="seal" />
        <text x="50" y="22" font-family="sans-serif" font-size="10" fill="#b91c1c" font-weight="bold" text-anchor="middle">ตราประทับวัด</text>
        <text x="50" y="38" font-family="sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">SEAL OF TEMPLE</text>
      </g>
    </g>
  </g>

  <!-- Right: Form Controls & Export Actions -->
  <g transform="translate(495, 95)">
    <rect x="0" y="0" width="240" height="335" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <rect x="0" y="0" width="240" height="38" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
    <text x="15" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">⚙️ ตัวเลือกเอกสาร (Export)</text>

    <g transform="translate(15, 55)">
      <text x="0" y="0" font-family="sans-serif" font-weight="700" font-size="12" fill="#242424">โหมดภาษา (Language):</text>
      <rect x="0" y="10" width="210" height="38" fill="#242424" />
      <text x="12" y="34" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff">✓ สองภาษา (TH / DE)</text>

      <text x="0" y="70" font-family="sans-serif" font-weight="700" font-size="12" fill="#242424">การลงนาม (Signature):</text>
      <rect x="0" y="80" width="210" height="38" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
      <text x="12" y="104" font-family="sans-serif" font-size="12" fill="#333333">Digital Signature Pad</text>

      <!-- Print / Export Button (44px target) -->
      <rect x="0" y="145" width="210" height="44" fill="#15803d" />
      <text x="45" y="172" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">🖨️ พิมพ์เอกสาร (PDF)</text>

      <rect x="0" y="200" width="210" height="55" fill="#f7ecdd" stroke="#945c26" stroke-width="1" />
      <text x="10" y="220" font-family="sans-serif" font-size="11" fill="#945c26" font-weight="bold">📄 ลดหย่อนภาษีในเยอรมนี</text>
      <text x="10" y="238" font-family="sans-serif" font-size="10" fill="#333333">รูปแบบเป็นทางการตาม Finanzamt</text>
    </g>
  </g>
</svg>
