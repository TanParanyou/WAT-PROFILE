<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .canvas { fill: #fbfbfa; }
      .surface { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .text-title { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #242424; }
      .text-muted { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #666666; }
      .text-body { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #333333; }
      .scanner-bracket { stroke: #15803d; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="800" height="480" class="canvas" />

  <!-- Main Container -->
  <rect x="40" y="25" width="720" height="430" class="surface" />

  <!-- Header -->
  <rect x="40" y="25" width="720" height="50" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
  <text x="65" y="56" class="text-title">📱 สแกนเช็คชื่อผู้เข้าร่วมงานวัดผ่าน QR Code (Live QR Attendance Scanner)</text>

  <!-- Left: Scanner Viewport (Square, Precise Border) -->
  <rect x="65" y="95" width="310" height="335" fill="#242424" stroke="#333333" stroke-width="1" />
  
  <!-- Camera Grid & QR Code Target -->
  <rect x="100" y="130" width="240" height="240" fill="#1c1a17" />
  
  <!-- QR Code Mockup in center -->
  <rect x="140" y="170" width="160" height="160" fill="#ffffff" />
  <rect x="155" y="185" width="40" height="40" fill="#242424" />
  <rect x="163" y="193" width="24" height="24" fill="#ffffff" />
  <rect x="169" y="199" width="12" height="12" fill="#242424" />
  
  <rect x="245" y="185" width="40" height="40" fill="#242424" />
  <rect x="253" y="193" width="24" height="24" fill="#ffffff" />
  <rect x="259" y="199" width="12" height="12" fill="#242424" />

  <rect x="155" y="275" width="40" height="40" fill="#242424" />
  <rect x="163" y="283" width="24" height="24" fill="#ffffff" />
  <rect x="169" y="289" width="12" height="12" fill="#242424" />

  <!-- Square Scanner Brackets (0px radius) -->
  <path d="M 120 150 L 120 130 L 140 130" class="scanner-bracket" />
  <path d="M 300 130 L 320 130 L 320 150" class="scanner-bracket" />
  <path d="M 120 350 L 120 370 L 140 370" class="scanner-bracket" />
  <path d="M 300 370 L 320 370 L 320 350" class="scanner-bracket" />

  <!-- Laser Line -->
  <line x1="120" y1="250" x2="320" y2="250" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 2" />
  
  <text x="160" y="395" font-family="sans-serif" font-weight="700" font-size="12" fill="#15803d">● กล้องกำลังสแกนสด...</text>

  <!-- Right: Verification Result -->
  <rect x="400" y="95" width="335" height="335" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <rect x="400" y="95" width="335" height="42" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
  <text x="420" y="121" font-family="sans-serif" font-weight="700" font-size="13" fill="#15803d">✓ เช็คชื่อสำเร็จ (Checked-in)</text>

  <!-- Result Details -->
  <g transform="translate(420, 160)">
    <text x="0" y="0" class="text-muted">ชื่อ-นามสกุล ผู้ลงทะเบียน:</text>
    <text x="0" y="22" font-family="sans-serif" font-weight="700" font-size="16" fill="#242424">คุณสมศรี ใจบุญ (1 ท่าน)</text>

    <text x="0" y="60" class="text-muted">กิจกรรม:</text>
    <text x="0" y="80" class="text-body" font-weight="600">พิธีเวียนเทียนวันวิสาขบูชา 2569</text>

    <text x="0" y="115" class="text-muted">เวลาที่เช็คชื่อ:</text>
    <text x="0" y="135" font-family="monospace" font-size="13" fill="#15803d" font-weight="bold">19 ส.ค. 2026, 08:15:22 น.</text>

    <rect x="0" y="165" width="295" height="85" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
    <text x="15" y="190" font-family="sans-serif" font-weight="700" font-size="12" fill="#242424">สถิติผู้เข้าร่วมกิจกรรม:</text>
    <text x="15" y="215" class="text-body">เช็คชื่อแล้ว: <tspan fill="#15803d" font-weight="700">85</tspan> / 100 ที่นั่ง</text>
    <text x="15" y="235" class="text-muted">อัตราการมาเข้าร่วม: 85%</text>
  </g>
</svg>
