<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .surface { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .tab-active { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="800" height="480" fill="#f1f5f9" />

  <rect x="50" y="30" width="700" height="420" class="surface" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.08))" />

  <!-- Header -->
  <rect x="50" y="30" width="700" height="54" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="75" y="63" class="text-title">🌐 การจัดการเนื้อหา 3 ภาษา (TH, EN, DE) ใน Website CMS</text>

  <!-- Language Tabs -->
  <g transform="translate(75, 105)">
    <!-- TH Tab (Active) -->
    <rect x="0" y="0" width="120" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="25" y="24" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0f172a">🇹🇭 ภาษาไทย</text>

    <!-- EN Tab -->
    <rect x="125" y="0" width="120" height="38" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <text x="150" y="24" font-family="sans-serif" font-size="13" fill="#64748b">🇬🇧 English</text>

    <!-- DE Tab -->
    <rect x="250" y="0" width="120" height="38" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <text x="275" y="24" font-family="sans-serif" font-size="13" fill="#64748b">🇩🇪 Deutsch</text>
  </g>

  <!-- Editor Form Area -->
  <g transform="translate(75, 155)">
    <rect x="0" y="0" width="650" height="265" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

    <!-- Field 1: Page Title -->
    <text x="20" y="30" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0f172a">หัวข้อส่วนเนื้อหา (Section Title) *</text>
    <rect x="20" y="42" width="610" height="38" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="32" y="66" font-family="sans-serif" font-size="13" fill="#1e293b">ประวัติและข้อมูลวัดพุทธบารมี ฮัมบวร์ก</text>

    <!-- Field 2: Subtitle / Description -->
    <text x="20" y="110" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0f172a">เนื้อหาและคำอธิบาย (Content / Body) *</text>
    <rect x="20" y="122" width="610" height="75" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="32" y="146" font-family="sans-serif" font-size="13" fill="#1e293b">ศูนย์รวมจิตใจของชาวไทยและพุทธศาสนิกชนในเยอรมนี...</text>

    <!-- Rule Check Alert -->
    <rect x="20" y="210" width="610" height="42" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="35" y="235" font-family="sans-serif" font-size="12" fill="#1e40af">💡 <tspan font-weight="bold">กฎสำคัญ:</tspan> ต้องกรอกข้อมูลครบทั้ง 3 ภาษา (TH, EN, DE) เพื่อให้การแสดงผลบนหน้าเว็บไซต์สมบูรณ์ 100%</text>
  </g>
</svg>
