<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .canvas { fill: #fbfbfa; }
      .surface { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .text-title { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #242424; }
      .text-muted { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #666666; }
      .text-body { font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #333333; }
    </style>
  </defs>

  <rect width="800" height="480" class="canvas" />

  <rect x="40" y="25" width="720" height="430" class="surface" />

  <!-- Header -->
  <rect x="40" y="25" width="720" height="50" fill="#f4f4f2" stroke="#d1d5db" stroke-width="1" />
  <text x="65" y="56" class="text-title">🌐 การจัดการเนื้อหา 3 ภาษา (TH, EN, DE) ใน Website CMS</text>

  <!-- Language Tabs (0px radius, 44px min-height) -->
  <g transform="translate(65, 95)">
    <!-- TH Tab (Active: Register Ink) -->
    <rect x="0" y="0" width="130" height="42" fill="#242424" />
    <text x="25" y="26" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">🇹🇭 ภาษาไทย</text>

    <!-- EN Tab -->
    <rect x="135" y="0" width="130" height="42" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="160" y="26" font-family="sans-serif" font-size="13" fill="#666666">🇬🇧 English</text>

    <!-- DE Tab -->
    <rect x="270" y="0" width="130" height="42" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="295" y="26" font-family="sans-serif" font-size="13" fill="#666666">🇩🇪 Deutsch</text>
  </g>

  <!-- Editor Form Card -->
  <g transform="translate(65, 145)">
    <rect x="0" y="0" width="670" height="285" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />

    <!-- Field 1: Title -->
    <text x="20" y="30" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">หัวข้อเนื้อหา (Section Title) *</text>
    <rect x="20" y="42" width="630" height="44" fill="#fcfcfb" stroke="#d1d5db" stroke-width="1" />
    <text x="35" y="68" class="text-body">ประวัติและข้อมูลวัดพุทธบารมี ฮัมบวร์ก</text>

    <!-- Field 2: Body -->
    <text x="20" y="115" font-family="sans-serif" font-weight="700" font-size="13" fill="#242424">เนื้อหาและคำอธิบาย (Content / Body) *</text>
    <rect x="20" y="127" width="630" height="85" fill="#fcfcfb" stroke="#d1d5db" stroke-width="1" />
    <text x="35" y="152" class="text-body">ศูนย์รวมจิตใจของชาวไทยและพุทธศาสนิกชนในเยอรมนี...</text>

    <!-- Notice Box (Terracotta Taupe Surface) -->
    <rect x="20" y="225" width="630" height="44" fill="#f7ecdd" stroke="#945c26" stroke-width="1" />
    <text x="35" y="252" font-family="sans-serif" font-size="12" fill="#945c26">📌 <tspan font-weight="bold">ข้อบังคับระบบ:</tspan> ต้องระบุเนื้อหาให้ครบทั้ง 3 ภาษา (TH, EN, DE) เพื่อให้หน้าเว็บสลับภาษาได้สมบูรณ์</text>
  </g>
</svg>
