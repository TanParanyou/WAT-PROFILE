name: Automated Tests & Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Verify Backend Modules & Vet
        run: |
          cd backend
          go mod tidy --diff || true
          go vet ./...

      - name: Run Backend Tests
        run: |
          cd backend
          go test ./... -p 1 -v

  frontend-checks:
    name: Frontend Lint, TypeCheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint
          npm run lint:admin-theme

      - name: Typecheck Frontend
        run: |
          cd frontend
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test
